name: CI/CD - Ficha Buffet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
            -t klohjoao/ficha-backend:latest \
            "./ficha-buffet"

      - name: Build Frontend
        run: |
          docker build \
            -t klohjoao/ficha-frontend:latest \
            "./anne-fichas-tecnicas-react/anne-fichas-tecnicas"

      - name: Push Backend
        run: |
          docker push klohjoao/ficha-backend:latest

      - name: Push Frontend
        run: |
          docker push klohjoao/ficha-frontend:latest

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/cliente/compose

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d --force-recreate

            docker image prune -f