function newId(col){return db?db.collection(col).doc().id:('x'+Math.random().toString(36).slice(2,12))}
async function put(col,id,data){if(!db)throw{code:'no_db'};await db.collection(col).doc(id).set(data)}
async function patch(col,id,data){if(!db)throw{code:'no_db'};await db.collection(col).doc(id).update(data)}
async function del(col,id){if(!db)throw{code:'no_db'};await db.collection(col).doc(id).delete()}
function clean(o){const r={};for(const k in o){if(o[k]!==undefined)r[k]=o[k]}return r}
function failMsg(e){
  if(e&&e.code==='no_db')return'Os dados só salvam com a página aberta no Claude.';
  if(e&&e.code==='invalid_argument')return canWrite?'O sistema recusou esta gravação. Confira os dados; se continuar, salve um backup e avise o suporte.':'Você tem acesso só de leitura a este sistema.';
  if(e&&e.code==='resource_exhausted')return'Muitas gravações seguidas. Espere alguns segundos e tente de novo.';
  if(e&&(e.code==='revoked'||e.code==='not_granted'))return'Seu acesso a este sistema mudou. Recarregue a página.';
  if(e&&e.code==='quota_exceeded')return'O banco de dados encheu. Exclua registros antigos para continuar.';
  return'Não foi possível salvar. Verifique a conexão e tente de novo.';
}

function alertas(){
  const t=today(), out=[];

  {const baixos=S.insumos.filter(i=>!reutilizavel(tipoItem(i))&&Number(i.estoqueMinimo)>0&&saldoDe(i.id)<Number(i.estoqueMinimo));if(baixos.length)out.push({tone:'warn',ord:5,html:'<b>'+baixos.length+' ite'+(baixos.length>1?'ns':'m')+'</b> abaixo do estoque mínimo: '+esc(baixos.slice(0,4).map(i=>i.nome).join(', '))+(baixos.length>4?'…':''),href:'#estoque'})}
  S.parcelas.filter(p=>!p.pagoEm&&p.vencimento&&p.vencimento<t).forEach(p=>{const e=byId('eventos',p.eventoId);if(e&&!ativo(e))return;const rc=Number(p.recebido)||0;out.push({tone:'bad',ord:diffDays(p.vencimento,t),html:'Parcela '+p.numero+' de <b>'+esc(e?e.nome:'evento')+'</b> venceu em '+fdate(p.vencimento)+' · '+(rc>0?'falta '+brl(p.valor-rc)+' de '+brl(p.valor):brl(p.valor)),ev:p.eventoId})});
  {const ap=S.lancamentos.filter(l=>!ehTransf(l)&&l.status==='previsto'&&grupoDe(l)!=='receita'&&vencDe(l));const vd=ap.filter(l=>vencDe(l)<t),pr=ap.filter(l=>vencDe(l)>=t&&vencDe(l)<=addDays(t,7));
   if(vd.length)out.push({tone:'bad',ord:-1,html:'<b>'+vd.length+' conta'+(vd.length>1?'s':'')+' a pagar vencida'+(vd.length>1?'s':'')+'</b> · '+brl(sum(vd,saldoLanc))+' · '+esc(vd.slice(0,3).map(l=>l.descricao).join(', '))+(vd.length>3?'…':''),act:'contas-pagar'});
   if(pr.length)out.push({tone:'warn',ord:2,html:'<b>'+pr.length+' conta'+(pr.length>1?'s':'')+' a pagar</b> nos próximos 7 dias · '+brl(sum(pr,saldoLanc))+' · próxima '+fdate(pr.map(vencDe).sort()[0]),act:'contas-pagar'})}
  {const rv=S.lancamentos.filter(l=>!ehTransf(l)&&l.status==='previsto'&&grupoDe(l)==='receita'&&!l.parcelaId&&evAtivoDe(l)&&vencDe(l)&&vencDe(l)<t);
   if(rv.length)out.push({tone:'bad',ord:0,html:'<b>'+rv.length+' conta'+(rv.length>1?'s':'')+' a receber vencida'+(rv.length>1?'s':'')+'</b> · '+brl(sum(rv,saldoLanc))+' · '+esc(rv.slice(0,3).map(l=>l.descricao).join(', '))+(rv.length>3?'…':''),act:'contas-receber'})}
  if(MODO==='admin'){const ns=semUnidade().length;if(ns)out.push({tone:'info',ord:60,html:'<b>'+ns+' lançamento'+(ns>1?'s':'')+' sem unidade de negócio</b>: classifique para ver o resultado do Buffet, do Restaurante e da Chocolates',act:'sem-unidade'})}
  S.eventos.filter(e=>e.status==='realizado'&&e.dataEvento&&diffDays(t,e.dataEvento)>=7).forEach(e=>out.push({tone:'info',ord:50,html:'<b>'+esc(e.nome)+'</b> foi realizado em '+fdate(e.dataEvento)+' e ainda não foi acertado',ev:e.id}));
  S.eventos.filter(e=>ativo(e)&&RANK[e.status]<RANK.realizado&&e.dataEvento&&e.dataEvento<t).forEach(e=>out.push({tone:'warn',ord:40,html:'<b>'+esc(e.nome)+'</b> já passou da data ('+fdate(e.dataEvento)+') e está como '+esc(stLabel(e.status)),ev:e.id}));
  if(MODO==='admin')czAlertas().forEach(a=>out.push(a));

  if(MODO==='admin')alertasEventos().forEach(a=>out.push(a));
  alertaBackup().forEach(a=>out.push(a));
  return out.sort((a,b)=>a.ord-b.ord);
}

/* ---------- Financeiro (lançamentos) ---------- */
/* ---------- Unidades de negócio, pagamentos e regimes ----------
   Cada lançamento pertence a uma unidade: Buffet Anne, Restaurante ANNE, Chocolates Marie & Anne ou Estrutura compartilhada
   (rateada entre as três pelo percentual em sistema/unidades). Lançamentos antigos não foram alterados: os ligados a evento
   contam como Buffet; os demais aparecem como "Sem unidade" até serem classificados.
   Pagamentos: lancamento.pagamentos = [{data,valor,conta,forma,em,por}] permite pagar ou receber em partes. Lançamentos antigos
   sem essa lista e com status "realizado" contam como pagos de uma vez na dataPagamento.
   Transferência entre unidades: lançamento tipo "transferencia" com unidadeOrigem e unidadeDestino; não mexe no caixa nem no
   consolidado, só move custo de uma unidade para outra, com rastro (quem, quando, o quê). */
const UNIDADES=[['buffet','Buffet Anne'],['restaurante','Restaurante ANNE'],['chocolates','Chocolates Marie & Anne'],['compartilhado','Estrutura compartilhada']];
const UN_OPER=['buffet','restaurante','chocolates'];
const unLabel=k=>k?(UNIDADES.find(u=>u[0]===k)||[k,k])[1]:'Sem unidade';
const unCurto=k=>({buffet:'Buffet',restaurante:'Restaurante',chocolates:'Chocolates',compartilhado:'Compartilhado'})[k]||'Sem unidade';
const unPill=k=>'<span class="pill un-'+(k||'sem')+'">'+esc(unCurto(k))+'</span>';
const ehTransf=l=>l.tipo==='transferencia';
let USER_ID=null;
function unidadeDe(l){if(l.unidade)return l.unidade;if(l.eventoId)return'buffet';if(l.conta==='banco_restaurante')return'restaurante';return''}
function rateio(){const d=byId('sistema','unidades'),r=(d&&d.rateio)||{},o={};let t=0;UN_OPER.forEach(u=>{o[u]=Math.max(0,Number(r[u])||0);t+=o[u]});
  UN_OPER.forEach(u=>{o[u]=t?o[u]*100/t:100/UN_OPER.length});return o}
const rateioDefinido=()=>{const d=byId('sistema','unidades');return!!(d&&d.rateio)};
/* peso do lançamento na unidade u: '' = consolidado, '_sem' = sem unidade */
function pesoUn(l,u,ratear){
  if(ehTransf(l)){if(!u||u==='_sem')return 0;return(l.unidadeDestino===u?1:0)-(l.unidadeOrigem===u?1:0)}
  if(!u)return 1;const lu=unidadeDe(l);
  if(u==='_sem')return lu===''?1:0;
  if(lu===u)return 1;
  if(ratear&&lu==='compartilhado'&&UN_OPER.includes(u))return rateio()[u]/100;
  return 0}
function pagosDe(l){if(ehTransf(l)||l.status==='cancelado')return[];if(Array.isArray(l.pagamentos)&&l.pagamentos.length)return l.pagamentos;
  if(l.status==='realizado')return[{data:l.dataPagamento||l.dataCompetencia,valor:Number(l.valor)||0,conta:l.conta||'banco'}];return[]}
const pagoDe=l=>round2(sum(pagosDe(l),p=>p.valor));
const saldoLanc=l=>ehTransf(l)||l.status==='realizado'||l.status==='cancelado'?0:Math.max(0,round2((Number(l.valor)||0)-pagoDe(l)));
const ultimoPag=l=>{const ps=pagosDe(l);return ps.length?ps.map(p=>p.data||'').sort().pop():''};
function vencDe(l){if(l.vencimento)return l.vencimento;if(l.parcelaId){const p=byId('parcelas',l.parcelaId);if(p&&p.vencimento)return p.vencimento}return l.dataCompetencia||''}

  if(v&&v<today())return['bad',p>0?'Parcial · vencido':'Vencido'];if(p>0)return['warn','Parcial'];return['','Em aberto']}
/* competência: receitas e custos de evento contam na data do evento; o resto, na competência lançada */
function compDe(l){if(l.eventoId){const e=byId('eventos',l.eventoId);if(e&&e.dataEvento)return e.dataEvento}return l.dataCompetencia||''}
const evAtivoDe=l=>{const e=l.eventoId&&byId('eventos',l.eventoId);return!e||ativo(e)};
const parteDe=l=>{if(grupoDe(l)==='receita'){const e=l.eventoId&&byId('eventos',l.eventoId),c=e&&byId('clientes',e.clienteId);return c?c.nome:(e?e.nome:'')}return l.fornecedor||''};
async function registrarPagamento(l,pg){
  const ant=Array.isArray(l.pagamentos)&&l.pagamentos.length?l.pagamentos.slice():[];
  const novo={data:pg.data,valor:round2(pg.valor),conta:pg.conta||l.conta||'banco',forma:pg.forma||'',em:new Date().toISOString(),por:USER_ID||''};
  const lista=ant.concat([novo]),tot=round2(sum(lista,p=>p.valor)),quit=tot>=round2(Number(l.valor)||0)-0.005;

  if(l.parcelaId&&byId('parcelas',l.parcelaId))await patch('parcelas',l.parcelaId,{pagoEm:quit?pg.data:null,recebido:tot,forma:pg.forma||''})}

  if(l.parcelaId&&byId('parcelas',l.parcelaId))await patch('parcelas',l.parcelaId,{pagoEm:null,recebido:round2(sum(ps,p=>p.valor))})}
/* pagar ou receber o saldo inteiro hoje (atalho usado pela nota fiscal) */

  const ent=l=>grupoDe(l)==='receita';
  const em=(lst,ini,fim)=>lst.filter(l=>{const v=vencDe(l)||'';return v>=ini&&v<=fim});
  const e30=em(ab.filter(ent),t,addDays(t,30)),s30=em(ab.filter(l=>!ent(l)),t,addDays(t,30)),venc=ab.filter(l=>(vencDe(l)||'')<t);

/* filter recebe a data (competência ou pagamento); opt: {un, regime:'competencia'|'caixa', ratear} */
function dreCalc(filter,inclPrev,opt){
  opt=opt||{};const u=opt.un||'',reg=opt.regime||'competencia',rat=opt.ratear!==false;
  const r={};GRUPOS.forEach(g=>r[g[0]]={total:0,cats:{}});
  S.lancamentos.forEach(l=>{if(l.status==='cancelado')return;const w=pesoUn(l,u,rat);if(!w)return;const g=grupoDe(l);if(!r[g])return;
    const add=v=>{v=v*w;r[g].total+=v;const k=l.categoriaId||'_';r[g].cats[k]=(r[g].cats[k]||0)+v};
    if(ehTransf(l)){if(filter(reg==='caixa'?l.dataCompetencia||'':compDe(l)))add(Number(l.valor)||0);return}
    if(reg==='caixa'){pagosDe(l).forEach(p=>{if(filter(p.data||''))add(Number(p.valor)||0)});return}
    if(!filter(compDe(l)))return;
    add(inclPrev?(Number(l.valor)||0):pagoDe(l))});
  return r;
}
function dreLinhas(r){
  const bruta=r.receita.total, liq=bruta-r.deducao.total, lb=liq-r.custo_direto.total, mc=lb-r.despesa_variavel.total, op=mc-r.despesa_fixa.total, fin=op-r.depreciacao_financeiro_ir.total;
  return{bruta,liq,lb,mc,op,final:fin};
}

/* ---------- folha (sheet) ---------- */
const stack=[];let lastTop=null;
function openSheet(s){stack.push(s);renderSheet()}
function closeSheet(all){if(all)stack.length=0;else stack.pop();renderSheet()}
function renderSheet(fromData){
  const root=$('#sheetroot');
  if(!stack.length){root.innerHTML='';lastTop=null;document.body.style.overflow='';return}
  const top=stack[stack.length-1];
  if(fromData&&!top.live)return;
  if(fromData&&top.live&&top.alive&&!top.alive()){closeSheet();return}
  const same=top===lastTop;lastTop=top;
  const fid=same&&document.activeElement&&root.contains(document.activeElement)?document.activeElement.id:null;
  const scroll=same&&root.querySelector('.sheet-b')?root.querySelector('.sheet-b').scrollTop:0;
  root.innerHTML='<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(top.title)+'"><div class="sheet-h">'+(stack.length>1?'<button class="btn sm ghost" data-back="1" aria-label="Voltar">‹ Voltar</button>':'')+'<span class="ttl">'+esc(top.title)+'</span><button class="btn sm ghost" data-close="1" aria-label="Fechar">Fechar</button></div><div class="sheet-b">'+top.body()+'</div></div>';
  document.body.style.overflow='hidden';
  const b=root.querySelector('.sheet-b');if(same)b.scrollTop=scroll;
  if(top.mount)top.mount(root.querySelector('.sheet'));
  if(fid){const f=document.getElementById(fid);if(f){try{f.focus({preventScroll:true})}catch(e){}}}
  if(!fromData&&!same){const f=root.querySelector('.sheet-b input:not([type=hidden]),.sheet-b select');if(f&&top.form)f.focus({preventScroll:true})}
}

const opt=(o,v)=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(v==null?'':v)?' selected':'')+'>'+esc(o[1])+'</option>';
function field(f){
  const id='f_'+f.name;let input;
  if(f.type==='select')input='<select id="'+id+'" name="'+f.name+'"'+(f.required?' required':'')+'>'+(f.blank!=null?'<option value="">'+esc(f.blank)+'</option>':'')+f.options.map(o=>o.group?'<optgroup label="'+esc(o.group)+'">'+o.items.map(i=>opt(i,f.value)).join('')+'</optgroup>':opt(o,f.value)).join('')+'</select>';
  else if(f.type==='textarea')input='<textarea id="'+id+'" name="'+f.name+'">'+esc(f.value)+'</textarea>';
  else if(f.type==='checkbox')return'<label class="check fld full" for="'+id+'"><input type="checkbox" id="'+id+'" name="'+f.name+'"'+(f.value?' checked':'')+'> '+esc(f.label)+'</label>'+(f.hint?'<p class="note" style="grid-column:1/-1;margin-top:-8px">'+esc(f.hint)+'</p>':'');
  else if(f.type==='money')input='<input id="'+id+'" name="'+f.name+'" inputmode="decimal" autocomplete="off" placeholder="0,00" value="'+esc(f.value==null||f.value===''?'':String(f.value).replace('.',','))+'"'+(f.required?' required':'')+'>';
  else input='<input id="'+id+'" name="'+f.name+'" type="'+(f.type||'text')+'"'+(f.type==='number'?' inputmode="numeric" min="0" step="1"':'')+' value="'+esc(f.value)+'"'+(f.required?' required':'')+(f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+'>';
  return'<label class="fld'+(f.full?' full':'')+'"'+(f.hidden?' hidden':'')+' for="'+id+'" data-wrap="'+f.name+'"><span>'+esc(f.label)+(f.required?' *':'')+'</span>'+input+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</label>';
}
function formSheet(o){
  openSheet({title:o.title,form:true,body:()=>'<form class="form" novalidate>'+(o.intro?'<p class="note" style="grid-column:1/-1">'+o.intro+'</p>':'')+o.fields.map(field).join('')+'<p class="note" style="grid-column:1/-1" data-err hidden style="color:var(--bad)"></p><div class="actions">'+(o.onDelete?'<button type="button" class="btn danger left" data-del>'+esc(o.deleteLabel||'Excluir')+'</button>':'')+'<button type="button" class="btn" data-back="1">Cancelar</button><button type="submit" class="btn primary">'+esc(o.submit||'Salvar')+'</button></div><div class="confirm" data-confirm hidden><p>'+esc(o.deleteConfirm||'Excluir de vez? Isso não pode ser desfeito.')+'</p><button type="button" class="btn sm" data-noconf>Cancelar</button><button type="button" class="btn sm danger solid" data-yesconf>Excluir</button></div></form>',
    mount:sh=>{
      const form=sh.querySelector('form');
      if(o.mount)o.mount(form);
      form.addEventListener('submit',async ev=>{ev.preventDefault();
        const fd=new FormData(form);const v={};o.fields.forEach(f=>{v[f.name]=f.type==='checkbox'?fd.has(f.name):(fd.get(f.name)==null?'':String(fd.get(f.name)).trim())});
        const err=o.validate?o.validate(v,form):null;const ep=form.querySelector('[data-err]');
        if(err){ep.textContent=err;ep.hidden=false;return}
        const btn=form.querySelector('[type=submit]');btn.disabled=true;
        const ok=await run(()=>o.onSubmit(v),o.okMsg||'Salvo');btn.disabled=false;
        if(ok){if(o.after)o.after();else closeSheet()}
      });
      const d=form.querySelector('[data-del]');if(d){d.onclick=()=>{form.querySelector('[data-confirm]').hidden=false};form.querySelector('[data-noconf]').onclick=()=>{form.querySelector('[data-confirm]').hidden=true};form.querySelector('[data-yesconf]').onclick=async()=>{const ok=await run(o.onDelete,'Excluído');if(ok){if(o.afterDelete)o.afterDelete();else closeSheet()}}}
    }});
}

/* um evento com dinheiro recebido ou pago, produção registrada ou lotes não pode ser apagado: o histórico ficaria errado */
function eventoTravado(e){if(!e||!e.id)return'';const m=[];
  const pg=S.lancamentos.filter(l=>l.eventoId===e.id&&(l.status==='realizado'||pagoDe(l)>0)).length;if(pg)m.push(pg+' lançamento'+(pg>1?'s':'')+' pago'+(pg>1?'s':'')+' ou recebido'+(pg>1?'s':''));

  if(S.lotes.some(l=>l.eventoId===e.id))m.push('lotes de pré-preparo');

/* ---------- Evento como projeto: etapas, previsto × realizado, equipe, logística e fechamento ----------
   Tudo fica no próprio documento do evento (campos novos: etapas, equipe, logistica, orcamento, fechamento).
   Nenhuma coleção nova; eventos antigos simplesmente não têm esses campos e o sistema calcula o que dá. */
const CUSTO_TIPOS=[['ab','Alimentos e bebidas'],['equipe','Equipe'],['transporte','Transporte e logística'],['outros','Locação e outros']];
const CUSTO_EV_OPTS=[['','Automático pelo nome']].concat(CUSTO_TIPOS);
function custoTipoCat(c){if(!c)return'outros';if(c.custoEvento)return c.custoEvento;const n=normTxt(c.nome);
  if(/\ba b\b|aliment|bebida|insumo|hortifrut|carne|mercearia|cmv/.test(n))return'ab';
  if(/mao de obra|equipe|garc|freela|pessoal|salari|diaria|extra de servico|staff/.test(n))return'equipe';
  if(/frete|transport|logistic|combust|veicul|van|carro|pedagio/.test(n))return'transporte';
  return'outros'}
const catMO=()=>catsSorted().find(c=>c.grupo!=='receita'&&custoTipoCat(c)==='equipe');
const FUNCOES=['Maître','Garçom','Garçonete','Cozinheiro(a)','Auxiliar de cozinha','Copeira','Bartender','Recepcionista','Motorista','Coordenação','Limpeza'];
const custoInsAtual=id=>Number((insC(id)||{}).custo)||0;
function evProjeto(id){
  const e=byId('eventos',id)||{},nd=necessidades(id),k=e.contrato||null,orc=e.orcamento||{};
  const ls=lancsDoEvento(id).filter(l=>!ehTransf(l));
  const recs=ls.filter(l=>grupoDe(l)==='receita'),custos=ls.filter(l=>grupoDe(l)!=='receita'&&grupoDe(l)!=='investimento');
  const contratado=round2(sum(recs,l=>l.valor)),recebido=round2(sum(recs,pagoDe)),aReceber=round2(contratado-recebido);
  const real={ab:0,equipe:0,transporte:0,outros:0};custos.forEach(l=>{real[custoTipoCat(cat(l.categoriaId))]+=Number(l.valor)||0});
  // estoque geral consumido: baixas, perdas e sobras do evento, menos o que foi comprado por nota para o evento
  const movs=S.movimentos.concat(baixasVirtuais()).filter(m=>m.eventoId===id);
  let consumo=0,avarias=0,comprado=0;
  movs.forEach(m=>{const i=insC(m.insumoId),q=Number(m.qtd)||0;if(!i)return;
    if(m.tipo==='entrada'&&m.origem==='nf'){comprado+=q*(Number(m.custoUnit)||custoInsAtual(i.id));return}
    if(!['baixa','perda','sobra'].includes(m.tipo))return;
    if(reutilizavel(tipoItem(i))){if(m.tipo==='perda')avarias+=-q*custoInsAtual(i.id);return}
    consumo+=-q*custoInsAtual(i.id)});
  const estoqueGeral=Math.max(0,round2(consumo-comprado));avarias=Math.max(0,round2(avarias));
  real.ab=round2(real.ab+estoqueGeral);real.outros=round2(real.outros+avarias);
  const pagar=custos.filter(l=>l.status==='previsto'),aPagar=round2(sum(pagar,saldoLanc));
  const equipeEsc=round2(sum(e.equipe||[],p=>p.valor));
  const prev={ab:round2(nd.custo),equipe:equipeEsc||round2(Number(orc.equipe)||0),transporte:round2(Number(orc.transporte)||0),outros:round2(Number(orc.outros)||0)};
  const totPrev=round2(prev.ab+prev.equipe+prev.transporte+prev.outros),totReal=round2(real.ab+real.equipe+real.transporte+real.outros);
  const conv=(k&&Number(k.convidadosContratados))||Number(e.convidadosPrevistos)||0;
  const receitaPrev=contratado||(k?Number(k.valorTotal)||0:0);
  return{e,nd,k,contratado,recebido,aReceber,real,prev,totPrev,totReal,conv,receitaPrev,estoqueGeral,avarias,aPagar,nPagar:pagar.length,
    resPrev:round2(receitaPrev-totPrev),resReal:round2(contratado-totReal),
    cmvPrev:receitaPrev?prev.ab/receitaPrev:NaN,cmvReal:contratado?real.ab/contratado:NaN}}
/* desvio: >10% acima do previsto */
const desvioDe=(p,r)=>p>0?(r-p)/p:(r>0?Infinity:0);
function desvios(P){return CUSTO_TIPOS.map(t=>({t,p:P.prev[t[0]],r:P.real[t[0]],d:desvioDe(P.prev[t[0]],P.real[t[0]])})).filter(x=>x.r>0&&x.d>0.1)}

 ['equipe','Escala de equipe'],['logistica','Logística e transporte'],['carregamento','Checklist de carregamento'],['execucao','Execução do evento'],
 ['conferencia','Conferência de consumo e devoluções'],['fechamento','Fechamento financeiro']];
/* situação de cada etapa: auto (o sistema detecta) ou manual (marcada pela equipe) */

function custoPrep(p,depth){depth=depth||0;let c=0,f=0;if(!p||depth>6)return{total:0,porUnid:0,faltando:0};
  (p.itens||[]).forEach(it=>{const q=(Number(it.qtd)||0)*(Number(it.fc)||1);
    if(it.subId){const s=prepC(it.subId);if(!s){f++;return}const cs=custoPrep(s,depth+1);c+=q*cs.porUnid;f+=cs.faltando;return}
    const i=insC(it.insumoId);if(!i||!(Number(i.custo)>0)){f++;return}c+=q*Number(i.custo)});
  const r=Number(p.rendimento)||1;return{total:c,porUnid:c/r,faltando:f}}

function explode(p,lotes,out,via,depth){depth=depth||0;if(!p||depth>6)return;
  (p.itens||[]).forEach(it=>{const q=lotes*(Number(it.qtd)||0)*(Number(it.fc)||1);
    if(it.subId){const s=prepC(it.subId);if(s)explode(s,q/(Number(s.rendimento)||1),out,s.nome,depth+1);return}

  const loucas={};

    const p=prepC(c.preparacaoId);if(!p)return;const st=statusItem(c);

      if(st==='sim'){custo+=pc.total*lotes;faltando+=pc.faltando}else custoDef+=pc.total*lotes;
      explode(p,lotes,(i,q,via)=>{linhas.push({i,q,via});if(!i)return;if(!ins[i.id])ins[i.id]={i,q:0,qDef:0,usos:[]};if(st==='sim')ins[i.id].q+=q;else ins[i.id].qDef+=q;if(!ins[i.id].usos.includes(p.nome))ins[i.id].usos.push(p.nome)});

/* ---------- Estoque integrado: origem, consumo por unidade, compras, validades, perdas, preços e conferência ---------- */
MOV_TIPOS.consumo={l:'Consumo / uso',tone:'accent',sinal:-1};
MOV_MANUAIS.push('consumo');
const ORIGENS_MOV={nf:'Compra recebida (NF)',manual:'Lançamento manual',inventario:'Inventário',checklist:'Checklist do evento',consumo:'Consumo da unidade'};
function origemLabel(m){
  if(m.virtual)return m.eventoId?'Consumo em evento (produção)':'Produção de pré-preparo';
  if(m.tipo==='consumo')return'Consumo · '+unCurto(m.unidade||'');
  if(m.tipo==='sobra')return'Sobra de evento';
  if(m.tipo==='perda'&&m.origem!=='checklist')return'Perda ou descarte';
  if(m.tipo==='devolucao')return'Devolução ao fornecedor';
  return ORIGENS_MOV[m.origem]||'Origem não informada'}
/* uso de lote do estoque (que já baixou insumos) em evento: abate da baixa do checklist para não baixar duas vezes */
function usoLoteEv(evId,prepId){let q=0;S.lotes.forEach(l=>{if(!l.baixaInsumos||l.preparacaoId!==prepId)return;(l.historico||[]).forEach(h=>{if(h.tipo==='uso'&&h.para==='evento'&&h.eventoId===evId)q+=Number(h.qtd)||0})});return q}
const valorMov=m=>Math.abs(Number(m.qtd)||0)*(Number(m.custoUnit)||custoInsAtual(m.insumoId));
const consumivel=i=>i&&!reutilizavel(tipoItem(i));

/* sugestão de compras: reservas dos eventos no horizonte + mínimo − saldo físico, arredondado para a embalagem */
function sugestaoCompras(hz){
  const lim=addDays(today(),hz),res=reservas(),ped=(byId('sistema','compras')||{}).pedidos||{};
  const ultEntrada=id=>S.movimentos.filter(m=>m.insumoId===id&&m.tipo==='entrada').map(m=>m.data||'').sort().pop()||'';
  const out=[];
  S.insumos.filter(consumivel).forEach(i=>{const r=res[i.id]||{};let reserv=0;const evs=[];
    for(const ev in r){const e=byId('eventos',ev);if(e&&e.dataEvento&&e.dataEvento<=lim){reserv+=r[ev];evs.push(codigoEvento(e))}}
    const min=Number(i.estoqueMinimo)||0,s=saldoDe(i.id),falta=r3(reserv+min-Math.max(0,s));if(!(falta>0.0005))return;
    const fc=Number(i.fatorCompra)||0,emb=fc>0?Math.ceil(falta/fc-1e-9):0,q=emb?r3(emb*fc):falta;
    const p=ped[i.id],pedido=p&&p.em&&!(ultEntrada(i.id)>=p.em.slice(0,10));
    out.push({i,reserv:r3(reserv),min,s,falta,emb,q,valor:round2(q*(Number(i.custo)||0)),evs,forn:i.fornecedor||'Sem fornecedor definido',pedido,pedEm:pedido?p.em:''})});
  return out.sort((a,b)=>a.forn.localeCompare(b.forn,'pt-BR')||String(a.i.nome).localeCompare(b.i.nome,'pt-BR'))}
/* validades de insumos: entradas com validade que ainda estão no estoque (as mais novas ficam, as mais antigas saem primeiro) */
function validadesInsumos(dias){const lim=addDays(today(),dias),out=[];

/* lê o XML da NF-e (nfeProc ou NFe) e devolve os dados para pré-preencher a nota */
function lerNFeXML(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('O arquivo não é um XML válido.');
  const inf=doc.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Este XML não é de uma NF-e (falta o bloco infNFe). Se for NFS-e ou NFC-e, lance manualmente.');
  const el=(p,t)=>p?p.getElementsByTagName(t)[0]||null:null, tx=(p,t)=>{const x=el(p,t);return x?x.textContent.trim():''}, nv=(p,t)=>{const n=Number(tx(p,t));return isFinite(n)?n:0};
  const ide=el(inf,'ide'),emit=el(inf,'emit'),tot=el(inf,'ICMSTot'),cobr=el(inf,'cobr');
  const chave=(inf.getAttribute('Id')||'').replace(/^NFe/,'')||tx(doc,'chNFe');
  const itens=[...inf.getElementsByTagName('det')].map(det=>{const pr=el(det,'prod'),im=el(det,'imposto');
    const custo=nv(pr,'vProd')-nv(pr,'vDesc')+nv(pr,'vFrete')+nv(pr,'vSeg')+nv(pr,'vOutro')+nv(el(im,'IPI'),'vIPI')+nv(im,'vICMSST');
    return{desc:tx(pr,'xProd'),cod:tx(pr,'cProd'),qtdNota:nv(pr,'qCom'),uCom:tx(pr,'uCom'),valor:round2(custo)}});
  const vNF=round2(nv(tot,'vNF'))||round2(sum(itens,i=>i.valor));
  const dif=round2(vNF-sum(itens,i=>i.valor));if(itens.length&&Math.abs(dif)>=0.01)itens[itens.length-1].valor=round2(itens[itens.length-1].valor+dif);
  const emissao=(tx(ide,'dhEmi')||tx(ide,'dEmi')).slice(0,10)||today();
  let parcelas=cobr?[...cobr.getElementsByTagName('dup')].map(d=>({venc:tx(d,'dVenc')||emissao,valor:round2(nv(d,'vDup')),pago:false})):[];
  const tPag=tx(el(inf,'detPag'),'tPag');
  let forma=parcelas.length?'boleto':(NF_TPAG[tPag]||'');
  if(!parcelas.length)parcelas=[{venc:emissao,valor:vNF,pago:false}];
  else{const sp=round2(sum(parcelas,p=>p.valor));if(Math.abs(sp-vNF)>=0.01&&sp>0){/* a cobrança às vezes vem sem o frete: mantém o que está no boleto */}}
  return{chave,numero:tx(ide,'nNF'),serie:tx(ide,'serie'),emissao,fornecedor:tx(emit,'xFant')||tx(emit,'xNome'),razaoSocial:tx(emit,'xNome'),cnpjFornecedor:tx(emit,'CNPJ')||tx(emit,'CPF'),itens,total:vNF,formaPag:forma||'boleto',parcelas,importadaXML:true};
}

/* importar nota pela foto: o Claude lê a imagem (DANFE, cupom ou nota manual) e devolve os campos */
const NF_FOTO_PROMPT='As imagens são foto(s) ou print(s) de UMA nota fiscal de compra de um buffet (DANFE de NF-e, NFC-e/cupom fiscal ou nota manual), em português do Brasil. Podem ser várias páginas da mesma nota.\n'
 +'Leia com atenção e responda SOMENTE com um objeto JSON neste formato:\n'
 +'{"legivel":true,"numero":"12345","serie":"1","emissao":"AAAA-MM-DD","fornecedor":"nome fantasia ou razão social do EMITENTE","razaoSocial":"","cnpjFornecedor":"só dígitos","chave":"44 dígitos da chave de acesso, sem espaços, ou vazio",'
 +'"itens":[{"desc":"descrição como está na nota","cod":"código do produto","unid":"KG","qtd":1.5,"valorUnit":10.5,"valor":15.75}],'
 +'"formaPag":"boleto|pix|cartao|dinheiro|transferencia|prazo|",'
 +'"parcelas":[{"venc":"AAAA-MM-DD","valor":0}],"duvidas":["campo ou item que ficou ilegível ou incerto"]}\n'
 +'REGRA DOS PRODUTOS: na tabela de produtos/serviços, de cada produto leia SOMENTE as colunas QUANTIDADE (qtd), V. UNITÁRIO (valorUnit) e V. TOTAL (valor), além da descrição, do código e da unidade só para identificar o produto. Copie os três números exatamente como estão impressos na linha do produto, sem arredondar e sem fazer nenhum cálculo. Ignore todas as outras colunas (NCM, CST, CFOP, BC ICMS, V. ICMS, V. ICMS ST, IPI, alíquotas), as linhas de texto embaixo de cada produto (Base FCP, Vlr FCP e semelhantes), os totais do rodapé da nota (frete, desconto, impostos, valor total) e anotações feitas à mão. Se a nota tiver várias folhas, cada produto entra uma única vez. '
 +'Números com ponto decimal, sem R$ nem separador de milhar. '
 +'"parcelas" vem do quadro FATURA/DUPLICATAS (número, vencimento, valor); se não houver, deixe []. Não invente: o que não conseguir ler deixe vazio ou 0 e cite em "duvidas". '
 +'O emitente (fornecedor) é quem vende, no topo da nota; não confunda com o destinatário (o buffet). Se a imagem não for uma nota fiscal legível, responda {"legivel":false,"duvidas":["motivo"]}.';
const nNum=v=>{if(typeof v==='number')return isFinite(v)?v:0;const s=String(v==null?'':v).replace(/[^\d,.\-]/g,'');if(!s)return 0;return s.includes(',')?num(s):(Number(s)||0)};
const isoOk=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v):'';
function normalizarFoto(r){
  if(!r||typeof r!=='object')throw new Error('Não consegui ler a nota. Tente uma foto mais nítida.');
  if(r.legivel===false)throw new Error('A foto não parece uma nota fiscal legível'+(Array.isArray(r.duvidas)&&r.duvidas[0]?': '+String(r.duvidas[0]).slice(0,120):'.'));
  const emissao=isoOk(r.emissao)||today();
  /* regra da Anne: de cada produto valem só QUANTIDADE, V. UNITÁRIO e V. TOTAL, exatamente como impressos. Nada é rateado nos itens. */
  const duv=[];
  const itens=(Array.isArray(r.itens)?r.itens:[]).map(it=>{const q=nNum(it.qtd),vu=nNum(it.valorUnit);let v=nNum(it.valor);if(!v&&q&&vu)v=round2(q*vu);
    const desc=String(it.desc||'').trim().slice(0,200);if(q&&vu&&v&&Math.abs(q*vu-v)>0.011)duv.push(desc+': quantidade × V. unitário ('+brl(q*vu)+') não bate com o V. total ('+brl(v)+')');
    return{desc,cod:String(it.cod||'').trim().slice(0,60),qtdNota:q,uCom:String(it.unid||'').trim().slice(0,10),valorUnit:vu||null,valor:round2(v)}}).filter(it=>it.desc||it.valor);
  if(!itens.length)throw new Error('Não encontrei os itens da nota na foto. Fotografe a parte dos produtos com boa luz.');
  const soma=round2(sum(itens,i=>i.valor));
  let parcelas=(Array.isArray(r.parcelas)?r.parcelas:[]).map(p=>({venc:isoOk(p.venc)||emissao,valor:round2(nNum(p.valor)),pago:false})).filter(p=>p.valor>0);
  const fp=String(r.formaPag||'').toLowerCase();let forma=FORMAS_PAG.some(f=>f[0]===fp)?fp:(parcelas.length?'boleto':'');
  /* o que as duplicatas cobram além dos produtos (impostos ST, frete, desconto) fica numa linha própria, só para o caixa */
  const somaParc=round2(sum(parcelas,p=>p.valor)),acrescimo=parcelas.length&&Math.abs(somaParc-soma)>=0.01?round2(somaParc-soma):0;
  const total=round2(soma+acrescimo);
  if(!parcelas.length)parcelas=[{venc:emissao,valor:total,pago:false}];
  const chave=String(r.chave||'').replace(/\D/g,'');
  return{chave:chave.length===44?chave:'',numero:String(r.numero||'').replace(/^0+(?=\d)/,'').slice(0,20),serie:String(r.serie||'').slice(0,5),emissao,fornecedor:String(r.fornecedor||r.razaoSocial||'').trim().slice(0,120),razaoSocial:String(r.razaoSocial||'').trim().slice(0,160),cnpjFornecedor:String(r.cnpjFornecedor||'').replace(/\D/g,'').slice(0,14),
    itens,total,acrescimo,formaPag:forma||'boleto',parcelas,importadaFoto:true,duvidas:duv.concat((Array.isArray(r.duvidas)?r.duvidas:[]).map(x=>String(x).slice(0,160)).filter(Boolean)).slice(0,10)}}

let louCache=null;
function loucasPorEvento(){const key=[S.cardapio,S.eventos,S.preparacoes,S.insumos];if(louCache&&louCache.k.every((x,i)=>x===key[i]))return louCache.v;
  const v={};S.eventos.filter(e=>ativo(e)&&e.status!=='acertado').forEach(e=>{const ls=necessidades(e.id).loucas;if(ls.length)v[e.id]=ls});louCache={k:key,v};return v}
function loucaFora(id){let f=0;S.eventos.forEach(e=>{const l=exOf('l_'+e.id+'__'+id);if(!l||l.saiu==null||l.saiu==='')return;f+=Math.max(0,(Number(l.saiu)||0)-(l.voltou==null||l.voltou===''?0:Number(l.voltou))-(Number(l.avaria)||0))});return f}
function loucaReservadaNaData(id,data){const out=[];const pe=loucasPorEvento();
  S.eventos.filter(e=>e.dataEvento===data&&(RESERVA_ST.includes(e.status)||e.status==='realizado')&&pe[e.id]).forEach(e=>{const x=pe[e.id].find(l=>l.i.id===id);if(!x)return;const l=exOf('l_'+e.id+'__'+id);if(l&&l.saiu!=null&&l.saiu!=='')return;out.push({e,q:x.q})});return out}
function estLoucas(){
  if(!UI.louData){const prox=S.eventos.filter(e=>ativo(e)&&e.dataEvento>=today()&&loucasPorEvento()[e.id]).sort((a,b)=>a.dataEvento.localeCompare(b.dataEvento))[0];UI.louData=prox?prox.dataEvento:today()}
  const data=UI.louData,its=S.insumos.filter(i=>reutilizavel(tipoItem(i))).sort((a,b)=>String(a.nome).localeCompare(b.nome,'pt-BR'));

  h+='<div class="toolbar"><label class="fator" for="loudata"><span class="m">Disponibilidade em</span><input type="date" class="sel-inline" id="loudata" value="'+esc(data)+'"></label><span class="note">'+(evsNaData.length?esc(evsNaData.map(e=>codigoEvento(e)+' · '+e.nome).join(', ')):'Nenhum evento nesta data')+'</span></div>';
  if(!its.length)return h+'<section class="panel">'+loadingEmpty(['insumos'],'<div class="empty"><b>Nenhuma louça ou utensílio cadastrado</b>Cadastre em Novo item com tipo Louça ou Utensílio, faça a contagem pelo inventário e inclua nas fichas.</div>')+'</section>';
  h+='<section class="panel"><div class="tablewrap"><table><thead><tr><th>Item</th><th class="r">Total</th><th class="r">Reservado '+fdate(data).slice(0,5)+'</th><th class="r">Fora (em eventos)</th><th class="r">Disponível '+fdate(data).slice(0,5)+'</th><th></th></tr></thead><tbody>';
  its.forEach(i=>{const tot=saldoDe(i.id),res=loucaReservadaNaData(i.id,data),rq=sum(res,r=>r.q),fora=loucaFora(i.id),disp=tot-rq-fora;
    h+='<tr><td style="white-space:normal;min-width:150px"><b>'+esc(i.nome)+'</b><br><span class="note">'+esc(tipoItemLabel(i))+(res.length?' · '+esc(res.map(r=>codigoEvento(r.e)+': '+fmtN(r.q)).join(', ')):'')+'</span></td><td class="r">'+fmtN(tot)+'</td><td class="r">'+(rq?fmtN(rq):'—')+'</td><td class="r">'+(fora?fmtN(fora):'—')+'</td><td class="r '+(disp<0?'neg':'')+'"><b>'+fmtN(disp)+'</b></td><td><button class="btn sm" data-avariaitem="'+esc(i.id)+'">Avaria</button></td></tr>'});
  h+='</tbody></table></div></section>';
  return h;
}

function matchPrep(linha){const a=toks(linha);if(!a.length)return[];const na=normTxt(linha);
  return S.preparacoes.map(p=>{const b=toks(p.nome),nb=normTxt(p.nome);const com=a.filter(w=>b.some(x=>x===w||(w.length>4&&x.startsWith(w.slice(0,w.length-1)))||(x.length>4&&w.startsWith(x.slice(0,x.length-1))))).length;
    let sc=2*com/(a.length+b.length);if(na===nb)sc=1;else if(nb.includes(na)||na.includes(nb))sc=Math.max(sc,.9);return{p,sc}}).filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc).slice(0,3)}

  const ps=pj.pratos.filter(x=>!x.pronto).sort((a,b)=>ordemCat(a.cat)-ordemCat(b.cat)||String(a.nome).localeCompare(b.nome,'pt-BR'));

  let h='<p class="note">A produzir = porção por convidado × '+pj.N+' pessoas (convidados + margem). Pratos <b>a definir</b> ainda não entram em compras nem no checklist.</p>';
  h+='<div class="kpis"><div class="kpi"><span class="k">Confirmados</span><span class="v">'+sim+'</span><span class="h">pratos Sim</span></div><div class="kpi"><span class="k">A definir</span><span class="v">'+def+'</span><span class="h">aguardando o cliente</span></div><div class="kpi"><span class="k">Fichas completas</span><span class="v">'+ps.filter(x=>x.st!=='nao'&&x.ficha==='Completa').length+'/'+ps.filter(x=>x.st!=='nao').length+'</span><span class="h">com insumos e preço</span></div><div class="kpi"><span class="k">Produzidos</span><span class="v">'+ps.filter(x=>x.st==='sim'&&Number(exItem(x.cid).produzido)>0).length+'/'+sim+'</span><span class="h">pelo checklist</span></div></div>';
  if(!ps.length)return h+'<section class="panel"><div class="empty"><b>Cardápio vazio</b>A gestão ainda não incluiu os pratos deste evento.</div></section>';
  let txt='LISTA DE PRODUÇÃO · '+pj.codigo+' · '+pj.nome+' · '+fdate(pj.data)+' · '+pj.N+' pessoas\n';
  h+='<section class="panel"><div class="tablewrap"><table class="cztable"><thead><tr><th>Prato</th><th>Praça</th><th>No cardápio</th><th class="r">Porção / pessoa</th><th class="r">A produzir</th><th class="r">Receitas</th><th>Ficha</th><th>Resp.</th><th>Início</th><th>Conclusão</th><th>Status</th></tr></thead><tbody>';
  let lc='';ps.forEach(x=>{if(x.cat!==lc){h+='<tr class="grp-row"><td colspan="11">'+esc(catPrepLabel(x.cat))+'</td></tr>';txt+='\n'+catPrepLabel(x.cat).toUpperCase()+'\n';lc=x.cat}
    const off=x.st==='nao';
    if(!off)txt+='- '+(x.st==='definir'?'[A DEFINIR] ':'')+x.nome+': '+qU(x.total,x.uu)+(x.resp?' · '+x.resp:'')+'\n';
    h+='<tr'+(off?' class="off"':'')+'><td class="wrapc"><b>'+esc(x.nome)+'</b></td><td>'+esc(x.praca)+'</td><td><span class="pill '+(x.st==='sim'?'accent':x.st==='definir'?'warn':'')+'">'+(x.st==='sim'?'Sim':x.st==='definir'?'A definir':'Não')+'</span></td><td class="r">'+esc(x.fator.replace(' por convidado',''))+'</td><td class="r"><b>'+(off?'—':qU(x.total,x.uu))+'</b></td><td class="r">'+(off||x.rend===1?'—':fmtN(Math.round(x.lotes*100)/100)+'×')+'</td><td><span class="pill '+(x.ficha==='Completa'?'good':x.ficha==='Incompleta'?'bad':'warn')+'">'+esc(x.ficha)+'</span></td><td>'+esc(x.resp||'—')+'</td>'+(off?'<td></td><td></td><td></td>':(()=>{const ex=exItem(x.cid),ps_=prodStatus(pj,x);return'<td><input class="ckin" type="time" data-czhora="'+esc(x.cid)+'" data-k="inicio" value="'+esc(ex.inicio||'')+'" aria-label="Início de '+esc(x.nome)+'"></td><td><input class="ckin" type="time" data-czhora="'+esc(x.cid)+'" data-k="fim" value="'+esc(ex.fim||'')+'" aria-label="Conclusão de '+esc(x.nome)+'"></td><td><span class="pill '+ps_[0]+'">'+ps_[1]+'</span></td>'})())+'</tr>'});
  h+='</tbody></table></div></section>';
  if(prontos.length){txt+='\nCOMPRADOS PRONTOS (retirar do estoque, não produzir)\n';
    h+='<section class="panel"><div class="panel-h"><h3>Comprados prontos · retirar do estoque</h3><span class="note">a produção não faz</span></div><div class="tablewrap"><table class="cztable"><thead><tr><th>Item</th><th>Fornecedor</th><th>No cardápio</th><th class="r">Quantidade</th><th>Retirar em</th><th>Finalização</th></tr></thead><tbody>'
      +prontos.map(x=>{const dt=pj.data?addDays(pj.data,-(x.dnf!=null?x.dnf:dnPadraoDe(x.cat,x.praca))):'';txt+='- '+x.nome+': '+qU(x.total,x.uu)+(x.forn?' · '+x.forn:'')+'\n';
        return'<tr><td class="wrapc"><b>'+esc(x.nome)+'</b></td><td>'+esc(x.forn||'—')+'</td><td><span class="pill '+(x.st==='sim'?'accent':'warn')+'">'+(x.st==='sim'?'Sim':'A definir')+'</span></td><td class="r"><b>'+esc(qU(x.total,x.uu))+'</b></td><td>'+fdate(dt)+'</td><td class="wrapc">'+esc(x.obsEnvio||'Finalizar conforme a ficha')+'</td></tr>'}).join('')+'</tbody></table></div></section>'}

/* 2 · Insumos por prato */
function czInsumos(pj){
  const ps=pj.pratos.filter(x=>x.st!=='nao').sort((a,b)=>PRACAS.indexOf(a.praca)-PRACAS.indexOf(b.praca)||ordemCat(a.cat)-ordemCat(b.cat)||String(a.nome).localeCompare(b.nome,'pt-BR'));
  let h='<p class="note">Cada card lê a ficha técnica e multiplica pela quantidade do evento. Sub-receitas (massa, recheio, molho) já aparecem abertas nos seus ingredientes, com "via". Agrupado por praça.</p>';
  if(!ps.length)return h+'<section class="panel"><div class="empty"><b>Nenhum prato no cardápio</b></div></section>';
  let txt='INSUMOS POR PRATO · '+pj.codigo+' · '+pj.nome+' · '+pj.N+' pessoas\n';
  let lp='';ps.forEach(x=>{if(x.praca!==lp){h+='<p class="grp">'+esc(x.praca)+'</p>';txt+='\n'+x.praca.toUpperCase()+'\n';lp=x.praca}
    txt+='\n'+(x.st==='definir'?'[A DEFINIR] ':'')+x.nome+' — '+qU(x.total,x.uu)+'\n';x.ins.forEach(i=>{txt+='  '+i.n+(i.via?' (via '+i.via+')':'')+': '+qU(i.qt,i.u)+'\n'});
    h+='<section class="panel czcard"><div class="panel-h"><div style="min-width:0"><span class="m" style="font-size:12px;color:var(--muted)">'+esc(catPrepLabel(x.cat))+' · '+esc(consLabel(x.conserv))+'</span><div style="font-weight:700">'+esc(x.nome)+(x.st==='definir'?' <span class="pill warn">a definir</span>':'')+'</div><span class="m" style="font-size:13px;color:var(--muted)">A produzir <b>'+esc(qU(x.total,x.uu))+'</b> · ficha rende '+esc(x.rendLabel)+(x.rend!==1?' · '+fmtN(Math.round(x.lotes*100)/100)+'× a receita':'')+(x.resp?' · resp. '+esc(x.resp):'')+'</span></div><span class="pill '+(x.ficha==='Completa'?'good':x.ficha==='Incompleta'?'bad':'warn')+'">'+esc(x.ficha)+'</span></div>';
    if(x.ins.length)h+='<div class="tablewrap"><table><thead><tr><th>Insumo</th><th class="r">Por receita ('+esc(x.rendLabel)+')</th><th class="r">Total do evento</th></tr></thead><tbody>'+x.ins.map(i=>'<tr><td class="wrapc">'+esc(i.n)+(i.via?'<br><span class="note">via '+esc(i.via)+'</span>':'')+'</td><td class="r">'+esc(qR(i.qb,i.u))+'</td><td class="r"><b>'+esc(qU(i.qt,i.u))+'</b></td></tr>').join('')+'</tbody></table></div>';
    else h+='<div class="empty">Ficha sem insumos cadastrados: peça à gestão para completar.</div>';
    if(x.modo||x.etapas.length||x.loucas.length)h+='<details class="czdet"><summary>Modo de preparo'+(x.loucas.length?', louças':'')+'</summary>'+(x.modo?'<p style="white-space:pre-wrap;margin:0 0 8px">'+esc(x.modo)+'</p>':'')+(x.etapas.length?'<ol style="margin:0 0 8px;padding-left:20px">'+x.etapas.map(t=>'<li>'+esc(t.desc)+(t.dn>=0?' <span class="note">(D-'+t.dn+')</span>':'')+'</li>').join('')+'</ol>':'')+(x.loucas.length?'<p class="note">Louças: '+esc(x.loucas.map(l=>fmtN(l.q)+'× '+l.n).join(', '))+'</p>':'')+'</details>';
    h+='</section>'});
  return h+czCopy(txt)}
/* 3 · Lista de compras */
function czCompras(pj){
  const cp=exOf('cp_'+pj.eventoId)||{},marc=cp.itens||{},f=UI.czCompra;
  const ls=pj.compras.map(x=>Object.assign({},x,{falta:r3(Math.max(0,x.q-x.est)),ok:!!marc[x.id]}));
  const vis=ls.filter(x=>f==='todos'?true:f==='comprados'?x.ok:(!x.ok&&(x.falta>0||x.qd>0)));
  let h='<p class="note">Soma dos insumos de todos os pratos, já com a margem. <b>Em estoque</b> = saldo físico menos o reservado para outros eventos. <b>Comprar</b> = confirmados − em estoque. Pratos a definir aparecem à parte e não entram no Comprar.</p>';
  h+='<div class="toolbar">'+[['comprar','A comprar'],['comprados','Comprados'],['todos','Todos']].map(c=>'<button class="chip" data-czcompra="'+c[0]+'" aria-pressed="'+(c[0]===f)+'">'+c[1]+'</button>').join('')+'</div>';
  if(!ls.length)return h+'<section class="panel"><div class="empty"><b>Nada a comprar ainda</b>Os pratos confirmados precisam ter ficha técnica com ingredientes.</div></section>';
  let txt='LISTA DE COMPRAS · '+pj.codigo+' · '+pj.nome+' · '+fdate(pj.data)+'\n';
  CAT_INS.forEach(g=>{const its=vis.filter(x=>(CAT_INS.includes(x.cat)?x.cat:'Outros')===g).sort((a,b)=>String(a.n).localeCompare(b.n,'pt-BR'));if(!its.length)return;
    let tg='';h+='<p class="grp">'+esc(g)+'</p><section class="panel"><div class="tablewrap"><table><thead><tr><th>Insumo</th><th class="r">Confirm.</th><th class="r">A definir</th><th class="r">Em estoque</th><th class="r">Comprar</th><th>Comprado</th></tr></thead><tbody>';
    its.forEach(x=>{const emb=x.fc>0&&x.falta>0?Math.ceil(x.falta/x.fc-1e-9)+'× '+(x.uc||'emb.'):'';if(!x.ok&&x.falta>0)tg+='- '+x.n+': '+qU(x.falta,x.u)+(emb?' ('+emb+')':'')+'\n';
      h+='<tr'+(x.ok?' class="off"':'')+'><td class="wrapc"><b>'+esc(x.n)+'</b><br><span class="note">'+esc(x.usos)+'</span></td><td class="r">'+(x.q?esc(qU(x.q,x.u)):'—')+'</td><td class="r">'+(x.qd?'<span class="warn-t">'+esc(qU(x.qd,x.u))+'</span>':'—')+'</td><td class="r">'+esc(qU(x.est,x.u))+'</td><td class="r"><b>'+(x.falta>0?esc(qU(x.falta,x.u)):'—')+'</b>'+(emb?'<br><span class="note">'+esc(emb)+'</span>':'')+'</td><td><input type="checkbox" class="czck" data-czcomprado="'+esc(x.id)+'" aria-label="Comprado: '+esc(x.n)+'"'+(x.ok?' checked':'')+'></td></tr>'});
    if(tg)txt+='\n'+g.toUpperCase()+'\n'+tg;h+='</tbody></table></div></section>'});
  if(!vis.length)h+='<section class="panel"><div class="empty">'+(f==='comprar'?'<b>Nada falta comprar</b>O estoque cobre os pratos confirmados, ou tudo já foi marcado como comprado.':'Nenhum item neste filtro.')+'</div></section>';
  h+='<p class="note">Ao receber a mercadoria, a entrada é feita pela nota fiscal em Estoque › Notas (gestão).</p>';
  return h+czCopy(txt)}
/* 4 · Cronograma do evento (D-n) */
function czTaskCard(t,showEv){const ini=t.data&&t.data<today()&&!t.feito;
  return'<div class="task'+(t.feito?' done':'')+(ini?' late':'')+'"><div class="tr">'+(showEv?'<span class="pchip ev">'+esc(t.ev.codigo)+'</span>':'')+'<span class="pchip">'+esc(t.praca)+'</span>'+(t.padrao&&!t.movida?'<span class="pchip warn" title="A ficha não tem etapas: dia sugerido pelo tipo de prato">prazo padrão</span>':'')+'<label class="check" style="margin-left:auto;font-size:13px"><input type="checkbox" data-czfeito="'+esc(t.ev.eventoId+'__'+t.k)+'"'+(t.feito?' checked':'')+'> Feito</label></div>'
    +'<span class="tt">'+esc(t.desc)+'</span>'+(t.produtos?'<span class="m">'+esc(t.produtos)+'</span>':'')+(showEv?'<span class="m">'+esc(t.ev.nome)+' · evento '+esc(fdate(t.ev.data).slice(0,5))+'</span>':'')
    +'<div class="tr"><input type="text" id="czr_'+esc(t.ev.eventoId+'__'+t.k)+'" data-czresp="'+esc(t.ev.eventoId+'__'+t.k)+'" value="'+esc(t.resp)+'" placeholder="Responsável" aria-label="Responsável"><button class="btn sm" data-czmove="'+esc(t.ev.eventoId+'__'+t.k)+'" data-d="1" aria-label="Um dia antes" title="Um dia antes">◀</button><button class="btn sm" data-czmove="'+esc(t.ev.eventoId+'__'+t.k)+'" data-d="-1" aria-label="Um dia depois" title="Um dia depois"'+(t.dn===0?' disabled':'')+'>▶</button></div></div>'}
function czCrono(pj){
  const ts=czTarefas(pj),f=UI.czPraca,vis=ts.filter(t=>!f||t.praca===f);
  const maxDn=Math.max(3,...ts.map(t=>t.dn==null?0:t.dn));
  let h='<p class="note">Tarefas geradas das etapas das fichas dos pratos confirmados, mais as tarefas fixas. Cada tarefa cai no dia = data do evento − antecedência (D-n). Ficha sem etapas gera "Produzir …" com <b>prazo padrão</b> pelo tipo de prato. Use ◀ ▶ para mudar o dia sem alterar a ficha.</p>';
  h+='<div class="summary"><span><b class="num">'+ts.filter(t=>t.feito).length+' de '+ts.length+'</b> tarefas feitas'+(ts.some(t=>t.data&&t.data<today()&&!t.feito)?' · <span class="neg">'+ts.filter(t=>t.data&&t.data<today()&&!t.feito).length+' atrasada(s)</span>':'')+'</span></div>';
  h+=czPracaChips(ts);
  let txt='CRONOGRAMA · '+pj.codigo+' · '+pj.nome+' · '+fdate(pj.data)+'\n';
  h+='<div class="kcol">';
  const cols=[null];for(let n=maxDn;n>=0;n--)cols.push(n);
  cols.forEach(dn=>{const list=vis.filter(t=>t.dn===dn);if(dn===null&&!list.length)return;const iso=dn==null?null:addDays(pj.data,-dn);
    const lbl=dn===null?'A posicionar':dn===0?'Dia do evento':'D-'+dn;
    if(list.length){txt+='\n'+lbl.toUpperCase()+(iso?' · '+dLabel(iso):'')+'\n';list.forEach(t=>{txt+='['+(t.feito?'x':' ')+'] '+t.praca+': '+t.desc+(t.resp?' · '+t.resp:'')+'\n'})}
    h+='<div class="box"><div class="dayhd'+(iso===today()?' today':'')+'"><span><span class="m">'+lbl+'</span><br><b class="num">'+(iso?dLabel(iso):'—')+'</b></span><span class="m">'+list.filter(t=>t.feito).length+'/'+list.length+'</span></div>'+(list.length?list.map(t=>czTaskCard(t,false)).join(''):'<div class="empty" style="padding:12px 14px">Nenhuma tarefa.</div>')+'</div>'});
  h+='</div>';
  return h+czCopy(txt)}
function czPracaChips(ts){const us=PRACAS.filter(p=>ts.some(t=>t.praca===p));return'<div class="toolbar"><button class="chip" data-czpraca="" aria-pressed="'+(!UI.czPraca)+'">Todas as praças</button>'+us.map(p=>'<button class="chip" data-czpraca="'+esc(p)+'" aria-pressed="'+(UI.czPraca===p)+'">'+esc(p)+'</button>').join('')+'</div>'}
/* Agenda da semana: todas as tarefas de todos os eventos por dia */
function czAgenda(pjs){
  const t=today();if(!UI.czSemana)UI.czSemana=segunda(t);const ini=UI.czSemana,dias=[];for(let i=0;i<7;i++)dias.push(addDays(ini,i));
  const all=[];pjs.forEach(p=>czTarefas(p).forEach(x=>all.push(x)));const f=UI.czPraca;const vis=all.filter(x=>!f||x.praca===f);
  const atras=vis.filter(x=>x.data&&x.data<t&&!x.feito).sort((a,b)=>a.data.localeCompare(b.data));
  const semDia=vis.filter(x=>x.dn==null&&x.ev.data>=t);
  let h='<div class="toolbar"><button class="btn sm" data-czsem="-7" aria-label="Semana anterior">◀</button><b class="num" style="min-width:170px;text-align:center">'+esc(dLabel(dias[0]))+' – '+esc(dLabel(dias[6]))+'</b><button class="btn sm" data-czsem="7" aria-label="Próxima semana">▶</button><button class="btn sm ghost" data-czsem="0">Esta semana</button></div>';
  h+=czPracaChips(all);
  if(atras.length)h+='<section class="panel"><div class="panel-h"><h3 class="neg">Atrasadas</h3><span class="pill bad">'+atras.length+'</span></div><div class="czlate">'+atras.map(x=>'<div class="lateitem"><span class="pchip ev">'+esc(x.ev.codigo)+'</span><span class="grow">'+esc(x.desc)+' <span class="note">· era '+esc(dLabel(x.data))+'</span></span><label class="check" style="font-size:13px"><input type="checkbox" data-czfeito="'+esc(x.ev.eventoId+'__'+x.k)+'"> Feito</label></div>').join('')+'</div></section>';
  let txt='AGENDA DA COZINHA · '+dLabel(dias[0])+' a '+dLabel(dias[6])+'\n';
  h+='<div class="week">';
  dias.forEach(d=>{const evs=pjs.filter(p=>p.data===d),list=vis.filter(x=>x.data===d).sort((a,b)=>a.ev.data.localeCompare(b.ev.data)||PRACAS.indexOf(a.praca)-PRACAS.indexOf(b.praca));
    if(evs.length||list.length){txt+='\n'+dLabel(d).toUpperCase()+'\n';evs.forEach(p=>{txt+='  ★ EVENTO '+p.codigo+' '+p.nome+' · '+p.N+' pessoas\n'});list.forEach(x=>{txt+='  ['+(x.feito?'x':' ')+'] '+x.ev.codigo+' · '+x.praca+': '+x.desc+(x.resp?' · '+x.resp:'')+'\n'})}
    h+='<div class="box wday'+(d===t?' today':'')+(!evs.length&&!list.length?' vazio':'')+'"><div class="dayhd'+(d===t?' today':'')+'"><span><b class="num">'+esc(dLabel(d))+'</b>'+(d===t?' <span class="pill accent">hoje</span>':'')+'</span><span class="m">'+(list.length?list.filter(x=>x.feito).length+'/'+list.length:'')+'</span></div>'
      +evs.map(p=>'<button class="evday" data-czabrir="'+esc(p.eventoId)+'"><span class="k">Evento</span><b>'+esc(p.codigo)+' · '+esc(p.nome)+'</b><span class="m">'+p.N+' pessoas'+(p.local?' · '+esc(p.local):'')+'</span></button>').join('')
      +(list.length?list.map(x=>czTaskCard(x,true)).join(''):(evs.length?'':'<div class="empty" style="padding:10px 14px">Sem tarefas.</div>'))+'</div>'});
  h+='</div>';
  if(semDia.length)h+='<section class="panel"><div class="panel-h"><h3>A posicionar</h3><span class="pill warn">'+semDia.length+'</span></div><div class="panel-b"><div class="kcol" style="padding:10px">'+semDia.map(x=>'<div class="box">'+czTaskCard(x,true)+'</div>').join('')+'</div></div></section>';
  return h+czCopy(txt)}
/* 5 · Checklist de produto pronto — saída e retorno (modelo da planilha) */
/* cada linha é conferida sozinha: prato, componente (↳), louça das fichas ou item de serviço */
function czRows(pj){const ev=pj.eventoId,rows=[];
  const ps=(pj.pratos||[]).filter(x=>x.st==='sim');
  const ordSec=k=>CZ_SECS.findIndex(x=>x[0]===k);
  ps.slice().sort((a,b)=>ordSec(czSecDe(a.cat))-ordSec(czSecDe(b.cat))||String(a.nome).localeCompare(b.nome,'pt-BR')).forEach(p=>{const sec=czSecDe(p.cat);
    rows.push({tipo:'prato',sec,id:'i_'+p.cid,base:{kind:'item',eventoId:ev,cardapioId:p.cid},nome:p.nome,u:/porç/.test(p.ulabel||'')?'porç.':p.uu,uf:p.uu,prev:p.total,cons:p.conserv,prod:true,envK:'enviadoQ',retK:'retorno',p,temComp:(p.comp||[]).length>0,resp:p.resp,obsP:p.obsEnvio||''});
    if((p.comp||[]).length)p.comp.forEach(k=>rows.push({tipo:'comp',sec,id:'c_'+p.cid+'__'+k.k,base:{kind:'comp',eventoId:ev,cardapioId:p.cid,key:k.k},nome:k.n,u:k.u,prev:k.prev,cons:k.cons,prod:true,envK:'enviadoQ',retK:'retorno',obsP:k.obs,prato:p.nome}));
    /* prato sem componentes cadastrados: separa pelos insumos da ficha, um por linha */
    else (p.ins||[]).forEach((i,ix)=>{const k='f_'+(i.k||ix);rows.push({tipo:'comp',daFicha:true,sec,id:'c_'+p.cid+'__'+k,base:{kind:'comp',eventoId:ev,cardapioId:p.cid,key:k},nome:i.n+(i.via?' (via '+i.via+')':''),u:i.u,prev:czArred(i.qt,i.u==='l'?'L':i.u),cons:i.cons||'ambiente',prod:true,envK:'enviadoQ',retK:'retorno',obsP:'',prato:p.nome})});
    rows.filter(r=>r.tipo==='prato'&&r.p===p).forEach(r=>{r.temComp=rows.some(x=>x.tipo==='comp'&&x.prato===p.nome)});});

/* ---------- fase A · Restaurante ANNE e pré-preparos ----------
   pratos_venda: pratos que o Restaurante ANNE vende, montados a partir das fichas técnicas (componentes) e de insumos diretos (extras).
   lotes: pré-preparos produzidos pela cozinha (molhos, massas, bases), com validade e saldo. Servem o restaurante e os eventos.
   Um lote para o restaurante (ou estoque geral) dá baixa nos insumos ao ser registrado; um lote de evento não, porque o checklist do evento já dá. */
const SECOES=[['serra','Serra'],['mar','Mar'],['campo','Campo'],['executivo','Almoço executivo'],['cafe','Café e biscoitos'],['sobremesa','Sobremesas'],['bebida','Bebidas'],['outro','Outros']];
const secaoLabel=k=>(SECOES.find(s=>s[0]===k)||[k,'Outros'])[1];
const META_CMV=0.32;
const DESTINOS=[['restaurante','Restaurante ANNE'],['geral','Estoque geral (restaurante e eventos)'],['evento','Evento']];
const destinoLabel=k=>(DESTINOS.find(d=>d[0]===k)||[k,'—'])[1];
const VALIDADE_PADRAO={refrigerado:3,congelado:30,quente:0,ambiente:5};
const validadeDiasDe=p=>p&&p.validadeDias!=null&&p.validadeDias!==''?Number(p.validadeDias):VALIDADE_PADRAO[conservDe(p)];
Object.assign(UI,{restBusca:'',loteFiltro:'ativos'});

function custoPrato(pv){let c=0,f=0;
  (pv.componentes||[]).forEach(x=>{const p=prepC(x.preparacaoId);if(!p){f++;return}const cp=custoPrep(p);c+=cp.porUnid*(Number(x.qtd)||0);f+=cp.faltando});
  (pv.extras||[]).forEach(x=>{const i=insC(x.insumoId);if(!i||!(Number(i.custo)>0)){f++;return}c+=(Number(x.qtd)||0)*Number(i.custo)});
  return{custo:c,faltando:f}}
function cmvTone(r){if(!isFinite(r))return'';return r<=META_CMV?'good':r<=META_CMV+0.06?'warn':'bad'}
function cmvDe(pv){const c=custoPrato(pv),pr=Number(pv.preco)||0;return{custo:c.custo,faltando:c.faltando,cmv:pr>0?c.custo/pr:NaN}}
const uPrep=p=>unidRendLabel((p&&p.unidadeRendimento)||'porções',2);

function fichasRestaurante(){
  const q=UI.restBusca.trim().toLowerCase();
  const ativos=S.pratos_venda.filter(x=>x.ativo!==false);
  const comCmv=ativos.map(cmvDe).filter(x=>isFinite(x.cmv));
  const acima=comCmv.filter(x=>x.cmv>META_CMV).length, incomp=ativos.filter(x=>!(x.componentes||[]).length&&!(x.extras||[]).length||cmvDe(x).faltando||!(Number(x.preco)>0)).length;
  let h='<div class="kpis">'+kpi('Pratos ativos',String(ativos.length),S.pratos_venda.length-ativos.length?(S.pratos_venda.length-ativos.length)+' fora da carta':'na carta')
    +kpi('CMV médio',comCmv.length?'<span class="'+(cmvTone(sum(comCmv,x=>x.cmv)/comCmv.length)==='bad'?'neg':'')+'">'+pct(sum(comCmv,x=>x.cmv)/comCmv.length)+'</span>':'—','meta '+pct(META_CMV))
    +kpi('Acima da meta','<span class="'+(acima?'neg':'')+'">'+acima+'</span>',acima?'reveja preço ou porção':'nenhum')
    +kpi('Incompletos',String(incomp),incomp?'sem ficha, preço ou custo':'tudo calculado')+'</div>';
  h+='<div class="toolbar"><input class="search" id="restbusca" type="search" placeholder="Buscar prato" value="'+esc(UI.restBusca)+'"></div>';
  h+='<section class="panel"><div class="panel-b">';
  const list=S.pratos_venda.filter(x=>!q||String(x.nome).toLowerCase().includes(q));
  if(!list.length)h+=loadingEmpty(['pratos_venda'],'<div class="empty"><b>'+(S.pratos_venda.length?'Nenhum prato encontrado':'Nenhum prato do restaurante cadastrado')+'</b>Cada prato da carta é montado com as fichas técnicas que leva e a quantidade por prato. O sistema calcula o custo e o CMV pelo preço de venda.</div>');
  SECOES.forEach(s=>{const ps=list.filter(x=>(x.secao||'outro')===s[0]).sort((a,b)=>(a.ativo===false)-(b.ativo===false)||String(a.nome).localeCompare(b.nome,'pt-BR'));if(!ps.length)return;
    h+='<div class="monthhead">'+esc(s[1])+'</div>';
    ps.forEach(x=>{const c=cmvDe(x),comp=(x.componentes||[]).map(k=>{const p=prepC(k.preparacaoId);return p?p.nome:null}).filter(Boolean);
      h+='<button class="row" data-pv="'+esc(x.id)+'"'+(x.ativo===false?' style="opacity:.6"':'')+'><span class="grow"><span class="t" style="display:block">'+esc(x.nome)+(x.ativo===false?' · fora da carta':'')+'</span><span class="m" style="display:block">'+(isFinite(c.cmv)&&!c.faltando?'<b style="color:var(--'+({good:'good',warn:'warn',bad:'bad'}[cmvTone(c.cmv)])+')">CMV '+pct(c.cmv)+'</b> · ':'<b style="color:var(--warn)">'+(Number(x.preco)>0?'custo incompleto':'sem preço')+'</b> · ')+esc(comp.length?comp.join(' + '):'sem fichas ligadas')+(x.codigoPdv?' · PDV '+esc(x.codigoPdv):'')+'</span></span>'
        +'<span class="amt">'+(Number(x.preco)>0?brl(x.preco):'—')+'<span class="m" style="display:block;font-weight:500">custo '+brl(c.custo)+'</span></span></button>'})});
  h+='</div></section>';
  h+='<p class="note">CMV = custo dos ingredientes do prato ÷ preço de venda. Verde até '+pct(META_CMV)+', amarelo até '+pct(META_CMV+0.06)+', vermelho acima. O custo vem das fichas técnicas e do preço dos insumos no cadastro.</p>';
  return h;
}

    +'<label class="fld" for="px_q_'+ix+'"><span>Por prato'+(i?' ('+esc(i.unidade)+')':'')+'</span><input id="px_q_'+ix+'" data-px="qtd" data-ix="'+ix+'" inputmode="decimal" autocomplete="off" value="'+esc(x.qtd)+'"></label>'

/* ---- lotes de pré-preparo ---- */
function loteSt(l){const s=Number(l.saldo)||0,t=today();
  if(s<=0)return['','Esgotado'];if(!l.validade)return['good','Sem validade'];
  if(l.validade<t)return['bad','Vencido'];if(l.validade===t)return['bad','Vence hoje'];if(l.validade===addDays(t,1))return['warn','Vence amanhã'];return['good','Válido']}
const loteAtivo=l=>(Number(l.saldo)||0)>0;
const loteUnid=l=>{const p=prepC(l.preparacaoId);return(p&&p.unidadeRendimento)||l.unidade||'porções'};
const loteValor=l=>{const p=prepC(l.preparacaoId);return p?custoPrep(p).porUnid*Math.max(0,Number(l.saldo)||0):0};
function codigoLote(data){const d=data.replace(/-/g,'').slice(2);const n=S.lotes.filter(l=>l.produzidoEm===data).length+1;return'L'+d+'-'+String(n).padStart(2,'0')}
function prontoPorPrep(){const m={};S.lotes.filter(loteAtivo).forEach(l=>{const st=loteSt(l)[1];if(st==='Vencido')return;(m[l.preparacaoId]=m[l.preparacaoId]||[]).push(l)});
  for(const k in m)m[k].sort((a,b)=>String(a.validade||'9').localeCompare(String(b.validade||'9')));return m}

function estPreparos(){
  const t=today(), ativos=S.lotes.filter(loteAtivo);
  const venc=ativos.filter(l=>loteSt(l)[1]==='Vencido'), hoje=ativos.filter(l=>['Vence hoje','Vence amanhã'].includes(loteSt(l)[1]));
  let h='<div class="kpis">'+kpi('Lotes com saldo',String(ativos.length),ativos.length?'de '+new Set(ativos.map(l=>l.preparacaoId)).size+' preparações':'nada pronto')
    +kpi('Vencem hoje ou amanhã','<span class="'+(hoje.length?'neg':'')+'">'+hoje.length+'</span>',hoje.length?'use primeiro':'nenhum')
    +kpi('Vencidos com saldo','<span class="'+(venc.length?'neg':'')+'">'+venc.length+'</span>',venc.length?'descarte e registre a perda':'nenhum')
    +kpi('Valor em pré-preparos',brl(sum(ativos.filter(l=>loteSt(l)[1]!=='Vencido'),loteValor)),'a custo de ficha')+'</div>';
  // pronto por preparação (FIFO)

/* ---------- Produção · Restaurante ANNE e Chocolates Marie & Anne ----------
   producoes: planos de produção por unidade (restaurante | chocolates) e período, separados dos eventos do buffet.
   itens: [{k, preparacaoId, qtd (na unidade de rendimento da ficha), feito, loteId, feitoEm}]
   Concluir um item cria um lote em Estoque › Pré-preparos com baixa de insumos: é o lote que baixa o estoque, uma vez só. */
const PROD_UN=[['restaurante','Restaurante ANNE'],['chocolates','Chocolates Marie & Anne']];
const PROD_ST=[['planejado','Planejado'],['em_producao','Em produção'],['concluido','Concluído']];
const prodStLabel=k=>(PROD_ST.find(x=>x[0]===k)||[k,'Planejado'])[1];
const prodStTone=k=>k==='concluido'?'good':k==='em_producao'?'accent':'';
Object.assign(UI,{prodUn:'restaurante',prodSel:'',prodTab:'lista'});
const prodK=()=>'i'+Math.random().toString(36).slice(2,9);
function prodLinhas(pl){return(pl.itens||[]).map(x=>{const p=prepC(x.preparacaoId),q=Number(x.qtd)||0,rend=Number(p&&p.rendimento)||1;return{x,p,q,rend,lotes:q/rend,u:(p&&p.unidadeRendimento)||'porções'}})}
function prodInsumos(pl,soPend){const agg={};
  prodLinhas(pl).forEach(l=>{if(!l.p||!(l.q>0)||(soPend&&l.x.feito))return;
    explode(l.p,l.lotes,(i,q)=>{if(!i||reutilizavel(tipoItem(i)))return;const a=agg[i.id]=agg[i.id]||{i,q:0,usos:[]};a.q+=q;if(!a.usos.includes(l.p.nome))a.usos.push(l.p.nome)})});
  return Object.values(agg).sort((a,b)=>String(a.i.nome).localeCompare(String(b.i.nome),'pt-BR'))}
function prodPeriodo(pl){return pl.dataInicio?(fdate(pl.dataInicio)+(pl.dataFim&&pl.dataFim!==pl.dataInicio?' a '+fdate(pl.dataFim):'')):'sem data'}
function prodStatusAuto(itens,atual){const n=itens.length,f=itens.filter(x=>x.feito).length;if(n&&f===n)return'concluido';if(f>0)return'em_producao';return atual==='concluido'?'em_producao':(atual||'planejado')}
async function prodSalvarItens(pl,itens){await patch('producoes',pl.id,{itens,status:prodStatusAuto(itens,pl.status),atualizadoEm:new Date().toISOString()})}

/* ---------- registro do último backup e restauração ----------
   sistema/backup guarda quando foi feito o último backup completo (.json) e quantos registros ele tinha.
   A restauração NUNCA apaga nada: só cria o que falta e, se você escolher, volta registros alterados à versão do backup.
   Antes de gravar, salva uma cópia do estado atual. Depois de gravar, confere registro por registro. */
Object.assign(S,{sistema:[]});
const RESTAURAVEIS=COLS.concat(['cozinha_exec']);
const BK_LBL={clientes:'Clientes',eventos:'Eventos',parcelas:'Parcelas',extras:'Extras',lancamentos:'Lançamentos',categorias:'Categorias',insumos:'Insumos',preparacoes:'Fichas técnicas',cardapio:'Itens de cardápio',movimentos:'Movimentos de estoque',nfs:'Notas fiscais',cozinha:'Eventos na Cozinha',cozinha_exec:'Registros do checklist',pratos_venda:'Pratos do restaurante',lotes:'Lotes de pré-preparo',producoes:'Planos de produção'};
const ultimoBackup=()=>{const d=byId('sistema','backup');return d&&d.ultimoEm?d:null};
const diaLocal=iso=>toIso(new Date(iso));

/* lê e confere o arquivo, sem gravar nada */
function analisarBackup(txt){
  let j;try{j=JSON.parse(txt)}catch(e){return{erro:'O arquivo não é um backup válido (não é JSON).'}}
  if(!j||typeof j!=='object'||!j.colecoes||typeof j.colecoes!=='object')return{erro:'Este arquivo não é um backup do Anne Gestão.'};
  if(j.app&&j.app!=='Anne Gestão')return{erro:'Este backup é de outro sistema ('+String(j.app).slice(0,40)+').'};
  const linhas=[],ignoradas=[];let invalidos=0;
  Object.keys(j.colecoes).forEach(col=>{
    if(!RESTAURAVEIS.includes(col)){ignoradas.push(col);return}
    const docs=j.colecoes[col]||{},atual=Object.fromEntries((S[col]||[]).map(d=>[d.id,d]));
    const novos=[],diferentes=[];let iguais=0;
    Object.keys(docs).forEach(id=>{const d=docs[id];
      if(!d||typeof d!=='object'||Array.isArray(d)||!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)||id==='.'||id==='..'){invalidos++;return}
      const corpo=Object.assign({},d);delete corpo.id;
      const a=atual[id];if(!a){novos.push([id,corpo]);return}
      const b=Object.assign({},a);delete b.id;if(canon(b)===canon(corpo))iguais++;else diferentes.push([id,corpo])});
    linhas.push({col,total:Object.keys(docs).length,novos,diferentes,iguais,soNoSistema:(S[col]||[]).filter(d=>!(d.id in docs)).length})});
  return{exportadoEm:j.exportadoEm||'',linhas,ignoradas,invalidos}}

async function gravarComRetry(col,id,corpo){
  for(let t=0;;t++){try{await db.collection(col).doc(id).set(corpo);return}
    catch(e){const transit=e&&(e.code==='unavailable'||e.code==='resource_exhausted');if(!transit||t>=4)throw e;await new Promise(r=>setTimeout(r,800*(t+1)+Math.random()*600))}}}

function restaurarSheet(nomeArq,an){
  let modo='faltantes',fase='revisar',feitos=0,falhas=[],conferencia=null,copiaOk=null;
  const alvo=()=>an.linhas.flatMap(l=>(modo==='todos'?l.novos.concat(l.diferentes):l.novos).map(x=>[l.col,x[0],x[1]]));
  openSheet({title:'Restaurar backup',live:true,
    body:()=>{
      const tot=alvo().length,nNov=sum(an.linhas,l=>l.novos.length),nDif=sum(an.linhas,l=>l.diferentes.length);
      let h='<p class="note">Arquivo <b>'+esc(nomeArq)+'</b>'+(an.exportadoEm?' · gerado em '+esc(fdh(an.exportadoEm)):'')+'.</p>';
      h+='<div class="box list">'+an.linhas.map(l=>'<div class="row" style="cursor:default"><span class="grow"><span class="t" style="display:block">'+esc(BK_LBL[l.col]||l.col)+'</span><span class="m" style="display:block">'+l.total+' no backup · '+l.iguais+' iguais'+(l.diferentes.length?' · '+l.diferentes.length+' diferente'+(l.diferentes.length>1?'s':''):'')+(l.soNoSistema?' · '+l.soNoSistema+' só no sistema':'')+'</span></span>'+(l.novos.length?'<span class="pill good">faltam '+l.novos.length+'</span>':'<span class="pill">completo</span>')+'</div>').join('')+'</div>';
      h+='<p class="note">"Só no sistema" são registros criados depois do backup: <b>a restauração não apaga nenhum deles</b>.'+(an.ignoradas.length?' Ignorados: '+esc(an.ignoradas.map(c=>BK_LBL[c]||c).join(', '))+' (a Cozinha é recalculada sozinha).':'')+(an.invalidos?' '+an.invalidos+' registro(s) inválido(s) no arquivo serão ignorados.':'')+'</p>';
      if(fase==='revisar'){
        h+='<div class="sec"><h3>O que restaurar</h3>'
          +'<label class="check"><input type="radio" name="rmodo" value="faltantes"'+(modo==='faltantes'?' checked':'')+'> Só o que está faltando ('+nNov+')</label>'
          +'<label class="check"><input type="radio" name="rmodo" value="todos"'+(modo==='todos'?' checked':'')+'> O que falta e também voltar os diferentes à versão do backup ('+(nNov+nDif)+')</label>'
          +(modo==='todos'&&nDif?'<p class="warn-t">Atenção: as alterações feitas depois do backup '+(nDif>1?'nesses '+nDif+' registros serão desfeitas':'neste registro serão desfeitas')+'.</p>':'')+'</div>';
        h+='<p class="note">Antes de gravar, o sistema salva no seu aparelho uma cópia do estado atual, para você poder voltar atrás.</p>';
        h+='<div class="actions"><button class="btn" data-back="1">Cancelar</button><button class="btn primary" data-rgo'+(tot?'':' disabled')+'>'+(tot?'Restaurar '+tot+' registro'+(tot>1?'s':''):'Nada a restaurar')+'</button></div>';
        if(copiaOk===false)h+='<div class="confirm"><p>A cópia do estado atual não foi salva. Quer restaurar mesmo assim?</p><button class="btn sm" data-back="1">Cancelar</button><button class="btn sm danger solid" data-rforce>Restaurar sem cópia</button></div>';
      }else if(fase==='gravando'){
        h+='<div class="summary"><b>Gravando… '+feitos+' de '+tot+'</b><span class="note">Não feche esta página até terminar.</span></div>';
      }else{
        h+='<div class="summary"><b>'+(falhas.length?'Restauração terminou com '+falhas.length+' falha'+(falhas.length>1?'s':''):'Restauração concluída')+'</b>'
          +'<span>'+(feitos-falhas.length)+' de '+tot+' registros gravados.</span>'
          +(conferencia?'<span class="'+(conferencia.ok===conferencia.total?'':'warn-t')+'">Conferência: '+conferencia.ok+' de '+conferencia.total+' registros conferidos no sistema, iguais ao backup.'+(conferencia.ok<conferencia.total?' Os demais ainda podem estar chegando; abra esta conferência de novo em alguns segundos.':'')+'</span>':'<span>Conferindo…</span>')
          +(falhas.length?'<span class="neg">Falharam: '+esc(falhas.slice(0,8).map(f=>(BK_LBL[f[0]]||f[0])+' '+f[1]).join(', '))+(falhas.length>8?'…':'')+'</span>':'')+'</div>';
        h+='<div class="actions"><button class="btn" data-rconf>Conferir de novo</button><button class="btn primary" data-close="1">Fechar</button></div>';
      }
      return h},
    mount:sh=>{
      sh.querySelectorAll('[name=rmodo]').forEach(r=>r.onchange=()=>{modo=r.value;renderSheet()});
      const conferir=()=>{const lst=alvo();let ok=0;lst.forEach(([col,id,corpo])=>{const a=byId(col,id);if(!a)return;const b=Object.assign({},a);delete b.id;if(canon(b)===canon(corpo))ok++});conferencia={ok,total:lst.length};renderSheet()};
      const gravar=async()=>{fase='gravando';feitos=0;falhas=[];renderSheet();
        const lst=alvo();
        for(const [col,id,corpo] of lst){try{await gravarComRetry(col,id,corpo)}catch(e){falhas.push([col,id,e&&e.code])}feitos++;if(feitos%5===0||feitos===lst.length)renderSheet()}
        fase='feito';renderSheet();
        try{await put('sistema','restauracao',{em:new Date().toISOString(),arquivo:String(nomeArq).slice(0,120),exportadoEm:an.exportadoEm||'',modo,gravados:feitos-falhas.length,falhas:falhas.length})}catch(e){}
        setTimeout(conferir,2500)};
      const go=sh.querySelector('[data-rgo]');if(go)go.onclick=async()=>{go.disabled=true;go.textContent='Salvando cópia do estado atual…';
        copiaOk=await bkSalvar('anne-gestao-antes-da-restauracao-'+today()+'.json',JSON.stringify(bkDados(),null,1));
        if(copiaOk)await gravar();else renderSheet()};
      const f=sh.querySelector('[data-rforce]');if(f)f.onclick=gravar;
      const rc=sh.querySelector('[data-rconf]');if(rc)rc.onclick=conferir;
    }});
}
function abrirArquivoBackup(){

/* ================= Produção por processos · ordens de produção =================
   Origem: ficha do evento + cardápio (Sim) + fichas técnicas. Nada é cadastrado de novo.
   Plano (gestão): eventos.producao = {geradoEm, liberadoEm, responsavel, horarios, plano:{[k]:{dn,hora,setor,resp}}}
   Setores: sistema/producao = {setores:[{id,nome,ativo}]}
   Execução (equipe): cozinha_exec 'op_<evento>__<k>' kind 'op' · 'lib_<evento>' kind 'lib'
   Baixa de estoque: só quando a ordem é CONFERIDA (status concluida), insumos diretos da ficha; sub-receitas têm ordem própria.
   Evento com ordens geradas: o "produzido" do checklist antigo deixa de dar baixa (evita baixa duplicada). */
const SETORES_PADRAO=[{id:'quente',nome:'Cozinha quente'},{id:'fria',nome:'Cozinha fria'},{id:'confeitaria',nome:'Confeitaria'},{id:'montagem',nome:'Montagem e finalização'},{id:'expedicao',nome:'Expedição e logística'}];
const OP_ST=[['pendente','Pendente',''],['em_producao','Em produção','accent'],['em_conferencia','Em conferência','warn'],['concluida','Concluída','good'],['bloqueada','Bloqueada','bad']];
const opStLabel=k=>(OP_ST.find(s=>s[0]===k)||OP_ST[0])[1],opStTone=k=>(OP_ST.find(s=>s[0]===k)||OP_ST[0])[2];
const ETAPAS_OP=[['principal','Preparação principal'],['pre','Pré-preparo'],['molho','Molho e acompanhamento'],['montagem','Finalização e montagem'],['expedicao','Acondicionamento e expedição']];
const etapaLabel=k=>(ETAPAS_OP.find(x=>x[0]===k)||[k,k])[1];
const MOTIVOS_BLOQ=[['insumo','Falta de insumo'],['equipamento','Falta de equipamento'],['informacao','Falta de informação'],['outro','Outro impedimento']];
const DN_OPC=[[7,'D-7'],[6,'D-6'],[5,'D-5'],[3,'D-3'],[2,'D-2'],[1,'D-1'],[0,'Dia do evento']];
const dnLabel=n=>n==null?'—':n===0?'Dia do evento':'D-'+n;
Object.assign(UI,{opView:'setor',opSetor:'',ldFiltro:'hoje'});
function setoresCfg(){const d=MODO==='admin'?byId('sistema','producao'):null;const l=d&&Array.isArray(d.setores)&&d.setores.length?d.setores:SETORES_PADRAO;return l.filter(s=>s&&s.id&&s.ativo!==false)}
const setorNome=id=>{const s=(MODO==='admin'?(byId('sistema','producao')||{}).setores:null)||SETORES_PADRAO;return((s.find?s:[]).find(x=>x.id===id)||SETORES_PADRAO.find(x=>x.id===id)||{nome:id||'—'}).nome};
function setorDe(p){if(p&&p.setor)return p.setor;const pr=p&&p.praca;if(pr==='Confeitaria')return'confeitaria';if(pr==='Frios')return'fria';if(pr==='No evento')return'montagem';if(pr==='Cozinha quente'||pr==='Salgados')return'quente';
  return({canape:'fria',entrada:'fria',ilha:'fria',sobremesa:'confeitaria',bebida:'expedicao'}[p&&p.categoria])||'quente'}
const ehMolho=p=>/molho|calda|creme|fondue|fonduta|ragu|ragù|pesto|vinagrete|maionese|redu[cç]|chutney|geleia|compota|caldo/i.test((p&&p.nome)||'');
const dnFicha=p=>p&&p.dnProducao!=null&&p.dnProducao!==''?Number(p.dnProducao):dnPadraoDe(p&&p.categoria,pracaDe(p));
/* gera as ordens do evento a partir das necessidades (só pratos Sim) */
function opsGerar(e,nd){
  const plano=(e.producao&&e.producao.plano)||{},ops=[],subs={};
  const dir=(p,lotes)=>(p.itens||[]).map(it=>{const q=lotes*(Number(it.qtd)||0)*(Number(it.fc)||1);if(it.subId){const s=prepC(it.subId);return s?{n:s.nome,q:r3(q),u:unidRendLabel(s.unidadeRendimento||'porções',q),sub:true}:null}const i=insC(it.insumoId);return i?{n:i.nome,q:Math.round(q*1e4)/1e4,u:i.unidade||''}:null}).filter(Boolean);
  const base=(k,p,et,setor,q,lotes,dn,orig)=>{const pl=plano[k]||{},u=(p&&p.unidadeRendimento)||'porções';
    return{k,prepId:p?p.id:'',nome:p?p.nome:'',etapa:et,setor:pl.setor||setor,q:r3(q),u:et==='montagem'||et==='expedicao'?unidRendLabel(u,q):unidRendLabel(u,q),rend:p?r3(Number(p.rendimento)||1):0,rendU:p?unidRendLabel(u,Number(p.rendimento)||1):'',receitas:r3(lotes),
      dn:pl.dn!=null&&pl.dn!==''?Number(pl.dn):dn,dnPadrao:pl.dn==null||pl.dn==='',hora:pl.hora||'',resp:pl.resp||'',origem:orig,tempoMin:p&&Number(p.tempoMin)>0?Math.round(Number(p.tempoMin)*Math.max(1,Math.ceil(lotes-1e-9))):0,
      equip:(p&&p.equipamentos)||'',armaz:((p&&p.armazenamento)||'')||(p?consLabel(conservDe(p)):''),cons:p?conservDe(p):'ambiente',valDias:p?validadeDiasDe(p):0,ins:[],passos:[],comp:[]}};
  const walk=(p,lotes,dnPai,usado,depth)=>{if(depth>5)return;(p.itens||[]).forEach(it=>{if(!it.subId)return;const s=prepC(it.subId);if(!s)return;const q=lotes*(Number(it.qtd)||0)*(Number(it.fc)||1);
    const m=subs[s.id]||(subs[s.id]={s,q:0,usos:[],dn:0});m.q+=q;if(!m.usos.includes(usado))m.usos.push(usado);m.dn=Math.max(m.dn,dnPai+1,dnFicha(s));walk(s,q/(Number(s.rendimento)||1),m.dn,usado,depth+1)})};
  nd.preps.filter(x=>x.st==='sim').forEach(x=>{const p=x.p,c=x.c,dn=dnFicha(p);
    const o=base('m_'+c.id,p,'principal',setorDe(p),x.total,x.lotes,dn,[p.nome]);
    o.ins=dir(p,x.lotes);o.passos=(p.etapas||[]).map(t=>t.desc).filter(Boolean);if(!o.passos.length&&p.modoPreparo)o.passos=String(p.modoPreparo).split(/\n+/).map(s=>s.trim()).filter(Boolean).slice(0,20);
    o.comp=(p.componentes||[]).filter(k=>k&&k.n).map(k=>({n:k.n,q:czArred((Number(k.q)||0)*x.total,k.u||'kg'),u:k.u||'kg'}));o.cid=c.id;
    if(p.compradoPronto){o.nome='Retirar do estoque · '+p.nome+' (comprado pronto)';o.etapa='pre';o.setor=(plano['m_'+c.id]||{}).setor||'expedicao';o.tempoMin=0;o.equip='';o.dn=(plano['m_'+c.id]||{}).dn!=null&&(plano['m_'+c.id]||{}).dn!==''?Number(plano['m_'+c.id].dn):1;
      o.passos=['Item comprado pronto do fornecedor: a produção não faz','Retirar do estoque a quantidade desta ordem','Conferir validade, embalagem e temperatura','Entregar para finalização e expedição']}if(c.responsavel&&!o.resp)o.resp=c.responsavel;ops.push(o);

  if(dl){btn.disabled=true;try{await dl.save({filename:nome.replace(/[^a-z0-9.\-]/gi,'-'),data:html});toast('Arquivo salvo: abra e imprima')}catch(e){if(e&&e.code!=='declined')toast('Não foi possível gerar o arquivo agora.')}btn.disabled=false;return}
  try{window.print()}catch(e){toast('A impressão não está disponível nesta tela.')}}
/* ---- eventos de interface ---- */
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-op],[data-opact],[data-opview],[data-opsetor],[data-opgerar],[data-opliberar],[data-opsetores],[data-opplano],[data-opresp],[data-opprint],[data-opmestre],[data-ldf],[data-libok],[data-libdesfazer]');if(!t)return;const d=t.dataset;
  if(d.op){const [e,k]=d.op.split('|');opSheet(e,k);return}
  if(d.opact){const [e,k]=d.opk.split('|');opAgir(e,k,d.opact);return}
  if(d.opview){UI.opView=d.opview;render();return}
  if(d.opsetor!=null){UI.opSetor=d.opsetor;render();return}
  if(d.ldf){UI.ldFiltro=d.ldf;render();return}
  if(d.opgerar){opPlanoSalvar(d.opgerar,pr=>{pr.geradoEm=new Date().toISOString();pr.plano=pr.plano||{}}).then(ok=>{if(ok)toast('Mapa de produção gerado · só a gestão vê até liberar')});return}
  if(d.opliberar){opPlanoSalvar(d.opliberar,pr=>{pr.liberadoEm=d.v==='1'?new Date().toISOString():''}).then(ok=>{if(ok)toast(d.v==='1'?'Ordens liberadas para a equipe':'Ordens recolhidas')});return}
  if(d.opsetores!=null){opSetoresForm();return}
  if(d.opmestre){opMestreForm(d.opmestre);return}
  if(d.opplano){const [e,k]=d.opplano.split('|');opPlanoForm(e,k);return}
  if(d.opresp){const [e,k]=d.opresp.split('|');const o=opFind(e,k);if(!o)return;formSheet({title:'Responsável · '+o.nome,fields:[{name:'resp',label:'Responsável',value:o.resp,required:true},{name:'quem',label:'Seu nome',value:opNome,required:true}],
    onSubmit:async v=>{guardaNome(v.quem.trim());await exSet(opId(e,k),Object.assign({kind:'op',eventoId:e,k},o.x,{resp:v.resp.trim(),hist:opHist(o.x,'responsável: '+v.resp.trim(),v.quem.trim())}))},okMsg:'Responsável definido'});return}
  if(d.opprint){const [e,k]=d.opprint.split('|');const o=opFind(e,k);if(o)opImprimir(t,opPrintHtml([o],'Ordem · '+o.nome,o.ev),'ordem-'+o.ev.codigo+'-'+o.k+'.html');return}
  if(d.libok){libAutorizar(d.libok);return}
  if(d.libdesfazer){libSalvar(d.libdesfazer,{autorizadoEm:'',autorizadoPor:'',comPendencias:false});return}
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.libck){const x=exOf('lib_'+t.dataset.ev)||{};libSalvar(t.dataset.ev,{ck:Object.assign({},x.ck||{},{[t.dataset.libck]:t.checked})});return}
  if(t.dataset.libhora!=null)libSalvar(t.dataset.ev,{horaSaida:t.value})});

render();
(async function boot(){
  try{db=window.claude?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){render();return}
  let admin=true;
  try{const u=await window.claude.use('user');if(u){try{USER_ID=await u.id()}catch(e){}admin=await u.canEdit();if(!admin){const w=await u.can('data.write');if(w===false){S.cozinhaNega=true;canWrite=false}}}}catch(e){}
  const timer=setTimeout(()=>{S.slow=true;schedule()},10000);
  const subs=[],retries={};
  const listen=c=>{subs.push(db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded[c]=true;
      if(!snap.metadata.fromCache)S.confirmed[c]=true;
      if(ACTIVE().every(x=>S.confirmed[x])){clearTimeout(timer);S.slow=false}
      // quem não enxerga a gestão (sem categorias nem eventos) mas enxerga a cozinha é a equipe da cozinha
      if(MODO==='admin'&&S.confirmed.categorias&&S.confirmed.eventos&&S.confirmed.cozinha&&!S.categorias.length&&!S.eventos.length&&S.cozinha.length){entrarCozinha();return}
      schedule();
    },err=>{
      // queda passageira: a única recuperação é assinar de novo (uma vez a cada poucos segundos)
      if(err&&err.code==='unavailable'&&(retries[c]=(retries[c]||0)+1)<=5){setTimeout(()=>listen(c),2000+Math.random()*3000*retries[c]);return}
      S.error=err;S.loaded[c]=true;clearTimeout(timer);schedule()}))};
  function entrarCozinha(){if(MODO==='cozinha')return;MODO='cozinha';subs.forEach(u=>{try{u()}catch(e){}});subs.length=0;S.error=null;
    document.querySelectorAll('.brand small').forEach(x=>x.textContent='Cozinha');document.body.classList.add('modo-cozinha');['cozinha','cozinha_exec'].forEach(listen);if(location.hash!=='#cozinha')location.hash='#cozinha';render()}
  if(!admin){entrarCozinha();return}
  ACTIVE().forEach(listen);
  render();
})();
})();
</script>
