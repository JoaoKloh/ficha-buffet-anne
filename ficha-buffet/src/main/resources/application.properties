spring.application.name=ficha-buffet

# Importação do .env
spring.config.import=optional:file:.env[.properties]

# Conexão com Fallback
spring.datasource.url=${URL_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Remover a linha do dialect, pois o Hibernate 6+ detecta o PostgreSQL automaticamente (conforme o WARN no log):
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

url.frontend=${URL_FRONTEND}

# O schema é versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só confere.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Bancos criados antes do Flyway entram na versão 1 (schema que o Hibernate gerava) e seguem daí.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true

# Remover a linha do dialect, pois o Hibernate 6+ detecta o PostgreSQL automaticamente (conforme o WARN no log):
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cookie.secure=${COOKIE_SECURE:false}

# Coleções e associações preguiçosas são buscadas em lotes (evita uma consulta por registro nos cálculos das telas).
spring.jpa.properties.hibernate.default_batch_fetch_size=100
