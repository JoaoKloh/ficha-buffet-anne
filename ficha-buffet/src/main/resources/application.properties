spring.application.name=ficha-buffet

# Importação do .env
spring.config.import=optional:file:.env[.properties]

# Conexão de runtime: usuário anne_app (só SELECT/INSERT/UPDATE/DELETE; sem DDL).
# POSTGRES_USER/POSTGRES_PASSWORD ficam só para o container do Postgres e para a administração (anne).
spring.datasource.url=${URL_DB:jdbc:postgresql}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O schema é versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só confere.
spring.jpa.hibernate.ddl-auto=validate

# Remover a linha do dialect, pois o Hibernate 6+ detecta o PostgreSQL automaticamente (conforme o WARN no log):
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

url.frontend=${URL_FRONTEND}
spring.flyway.enabled=true
# Bancos criados antes do Flyway entram na versão 1 (schema que o Hibernate gerava) e seguem daí.
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
# Migrations numa conexão própria (anne_migrator), separada da conexão de runtime.
# Cada conexão do Flyway assume anne_owner, para que os objetos novos nasçam com o dono
# certo e recebam os privilégios padrão de anne_app (db-admin/privilegios/README.md).
spring.flyway.url=${FLYWAY_URL:${URL_DB:jdbc:postgresql}}
spring.flyway.user=${FLYWAY_USER}
spring.flyway.password=${FLYWAY_PASSWORD}
spring.flyway.init-sqls=SET ROLE ${FLYWAY_ROLE:anne_owner}

# Remover a linha do dialect, pois o Hibernate 6+ detecta o PostgreSQL automaticamente (conforme o WARN no log):
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cookie.secure=${COOKIE_SECURE}

# Coleções e associações preguiçosas são buscadas em lotes (evita uma consulta por registro nos cálculos das telas).
spring.jpa.properties.hibernate.default_batch_fetch_size=100
