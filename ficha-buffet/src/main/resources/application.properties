spring.application.name=ficha-buffet

# Importação do .env
spring.config.import=optional:file:.env[.properties]

# Conexão com Fallback
spring.datasource.url=${URL_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Remover a linha do dialect, pois o Hibernate 6+ detecta o PostgreSQL automaticamente (conforme o WARN no log):
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

url.frontend=${URL_FRONTEND}
cookie.secure=${COOKIE_SECURE:false}