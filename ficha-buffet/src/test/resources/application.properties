spring.datasource.url=jdbc:h2:mem:fichadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=RUNSCRIPT FROM 'classpath:h2-compat-postgres.sql'
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# As migrações usam SQL do PostgreSQL; nos testes o H2 recebe o schema das entidades.
spring.flyway.enabled=false
spring.jpa.show-sql=false

spring.config.import=optional:file:.env[.properties]

url.frontend=http://localhost:3000
cookie.secure=false

spring.jpa.properties.hibernate.default_batch_fetch_size=100
